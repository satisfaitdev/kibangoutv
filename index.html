<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>KibangouTV - Canal+, beIN Sports, Télé Congo, Films & Séries</title>
  
  <!-- Moteur Vuma -->
  <link rel="stylesheet" href="https://vuma.mx/latest/style.css">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#00C853">
  
  <!-- PWA Manifest & Icônes App -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KibangouTV">
  <meta name="application-name" content="KibangouTV">

  <!-- Prise en charge télécommande TV (D-pad), tactile et PC -->
  <meta name="mhub" content="app dpad">

  <style>
    /* ========================================================
       KIBANGOUTV - STYLES GLOBAUX & PERSONNALISATIONS
       ======================================================== */
    :root {
      --accent: #00C853;
      --accent-rgb: 0, 200, 83;
      --bg-dark: #0E1318;
      --surface-dark: #151C24;
      --surface-border: #232D38;
      --text-muted: #8E99A4;
    }

    /* 1. Masquer l'option Social dans la sidebar et la bottom nav */
    a.nav-item[href="#/social"],
    a.bnav-item[href="#/social"],
    .nav-social {
      display: none !important;
    }

    /* 2. Masquer le bouton 'Supprimer les données de ce site' et la section Social dans Paramètres */
    .s-label-danger,
    div:has(> .s-label-danger),
    .s-group:has(.s-label-danger) {
      display: none !important;
    }

    /* Masquer le groupe Social dans les réglages */
    .s-group[data-group="social"],
    .s-group:has(.s-gicon):has(.toggle) {
      display: none !important;
    }

    /* ========================================================
       SUPPRESSION TOTALE DU BOUTON FLOTTANT SOCIAL SUR MOBILE & PC
       ======================================================== */
    .sv-fab,
    .feature-dock,
    .feature-dock-bar,
    .feature-bar,
    .feature-bar-docked,
    .modal-social,
    .social-view,
    .btn-party,
    .btn-hero-glass.btn-party,
    .modal-party,
    .player-action-invite,
    [class*="player-action-invite"],
    button[title*="Inviter"],
    button[title*="inviter"],
    button[aria-label*="Inviter"],
    button[aria-label*="inviter"],
    .pt-seat-plus,
    .sc-track,
    .sc-slot,
    .sc-pill,
    .sc-pill-shadow,
    .sc-front,
    .sc-back,
    .sc-covers,
    [class*="sc-track"],
    [class*="sc-slot"],
    [class*="sc-pill"],
    [class*="sv-fab"],
    [class*="feature-dock"],
    a[href="#/social"],
    a.nav-item[href="#/social"],
    a.bnav-item[href="#/social"],
    .nav-social {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
    }

    /* Masquer Recherche et Paramètres de la barre du bas (.bnav) */
    .bnav a[href="#/search"],
    .bnav a[href*="search"],
    .bnav a[href="#/settings"],
    .bnav a[href*="settings"] {
      display: none !important;
    }

    /* ========================================================
       EN-TÊTE MOBILE & BOTTOM NAVBAR SUR MOBILE (< 768px)
       ======================================================== */
    #mobile-top-header {
      display: none;
    }

    @media (max-width: 768px) {
      #mobile-top-header {
        display: flex !important;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(54px + var(--sat, 0px));
        padding-top: var(--sat, 0px);
        padding-left: 14px;
        padding-right: 14px;
        align-items: center;
        justify-content: space-between;
        background: rgba(14, 19, 24, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 99999 !important;
        box-sizing: border-box;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }

      /* Masquer l'en-tête mobile si le lecteur plein écran est ouvert */
      html.player-open #mobile-top-header {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }

      /* Masquer Recherche et Paramètres de la barre du bas (.bnav) sur mobile */
      .bnav a[href="#/search"],
      .bnav a[href*="search"],
      .bnav a[href="#/settings"],
      .bnav a[href*="settings"] {
        display: none !important;
      }

      /* Ajustement du décalage de contenu pour les pages sans hero */
      body:not(.is-home) .main-inner,
      body:not(.is-home) .main,
      body:not(.is-home) .stage {
        padding-top: calc(54px + var(--sat, 0px)) !important;
      }
    }

    .m-brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #FFFFFF;
    }

    .m-brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      filter: drop-shadow(0 2px 8px rgba(0, 200, 83, 0.55));
    }

    .m-brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    .m-brand-accent {
      color: var(--accent);
    }

    .m-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .m-header-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #B8B8B8;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .m-header-icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .m-header-icon-btn:hover,
    .m-header-icon-btn:active,
    .m-header-icon-btn.active {
      background: rgba(0, 200, 83, 0.18);
      border-color: rgba(0, 200, 83, 0.45);
      color: var(--accent);
      transform: scale(1.04);
    }

    .m-header-icon-btn.m-btn-logout:hover,
    .m-header-icon-btn.m-btn-logout:active {
      background: rgba(248, 113, 113, 0.2);
      border-color: rgba(248, 113, 113, 0.5);
      color: #f87171;
    }

    /* Style du bouton déconnexion dans la sidebar desktop */
    .nav-item-logout {
      margin-top: auto;
      color: #f87171 !important;
      cursor: pointer;
    }
    .nav-item-logout:hover {
      background: rgba(248, 113, 113, 0.12) !important;
    }

    /* ========================================================
       LOADER UNIVERSEL AVEC LOGO KIBANGOUTV
       ======================================================== */
    #kibangou-global-loader {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      background: rgba(14, 19, 24, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    #kibangou-global-loader.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .kibangou-loader-box {
      background: rgba(21, 28, 36, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 200, 83, 0.25);
      animation: loaderPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes loaderPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .kibangou-loader-logo-wrap {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kibangou-loader-img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      filter: drop-shadow(0 4px 14px rgba(0, 200, 83, 0.6));
      animation: logoPulse 1.6s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 14px rgba(0, 200, 83, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(0, 200, 83, 0.85)); }
    }

    .kibangou-loader-spin {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #00C853;
      border-right-color: #00C853;
      animation: spinRing 0.75s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .kibangou-loader-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    .kibangou-loader-subtitle {
      font-size: 0.82rem;
      color: #8E99A4;
      font-weight: 500;
    }

    /* ========================================================
       PORTAIL D'AUTHENTIFICATION (PIN 6 CHIFFRES & E-MAIL WEB)
       ======================================================== */
    #auth-gate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at 50% 30%, #151e28 0%, #0a0d12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #auth-gate.unlocked {
      display: none !important;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: rgba(21, 28, 36, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 200, 83, 0.15);
      backdrop-filter: blur(20px);
    }

    .auth-logo {
      width: 68px;
      height: 68px;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 18px rgba(0, 200, 83, 0.4));
    }

    .auth-brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .auth-brand span {
      color: #00C853;
    }

    .auth-title {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    /* Affichage des 6 chiffres PIN */
    .pin-display {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 44px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #00C853;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pin-dot.filled {
      background: rgba(0, 200, 83, 0.12);
      border-color: #00C853;
      box-shadow: 0 0 14px rgba(0, 200, 83, 0.35);
    }

    .pin-dot.filled::after {
      content: "•";
      font-size: 28px;
      color: #00C853;
    }

    /* Clavier virtuel PIN */
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 18px;
    }

    .pin-key {
      height: 52px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .pin-key:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .pin-key:active {
      transform: scale(0.94);
      background: rgba(0, 200, 83, 0.2);
    }

    .pin-key.key-action {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Formulaire de connexion par e-mail (Web) */
    .email-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .email-input-wrapper {
      position: relative;
      width: 100%;
    }

    .email-input {
      width: 100%;
      box-sizing: border-box;
      height: 48px;
      padding: 0 16px 0 42px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .email-input:focus {
      border-color: #00C853;
      box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.25);
    }

    .email-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .auth-btn {
      height: 48px;
      width: 100%;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00C853 0%, #00963d 100%);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 18px rgba(0, 200, 83, 0.4);
    }

    .auth-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 22px rgba(0, 200, 83, 0.5);
    }

    .auth-btn:active {
      transform: scale(0.98);
    }

    .mode-switch-btn {
      background: none;
      border: none;
      color: #00C853;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s, opacity 0.15s;
    }

    .mode-switch-btn:hover {
      background: rgba(0, 200, 83, 0.1);
    }

    .auth-error {
      font-size: 12px;
      color: #FF5252;
      min-height: 18px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    @keyframes pin-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: pin-shake 0.35s ease;
    }
  </style>

  <!-- Polyfill mHub API & bypass de cache corrompu -->
  <script>
    // Nettoyer tout cache d'addon corrompu
    try {
      localStorage.removeItem("vuma_addons_disabled");
      localStorage.removeItem("vuma_addons");
    } catch(e) {}

    const nativeFetch = window.fetch;

    // Contrôleur du loader global KibangouTV
    let pendingRequestsCount = 0;
    let loaderTimer = null;

    function showGlobalLoader() {
      pendingRequestsCount++;
      if (pendingRequestsCount === 1) {
        clearTimeout(loaderTimer);
        loaderTimer = setTimeout(() => {
          if (pendingRequestsCount > 0) {
            const el = document.getElementById("kibangou-global-loader");
            if (el) el.classList.add("is-visible");
          }
        }, 160);
      }
    }

    function hideGlobalLoader() {
      pendingRequestsCount = Math.max(0, pendingRequestsCount - 1);
      if (pendingRequestsCount === 0) {
        clearTimeout(loaderTimer);
        const el = document.getElementById("kibangou-global-loader");
        if (el) el.classList.remove("is-visible");
      }
    }

    function getProxiedUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string") return rawUrl;

      // Déjà sur le proxy ou ressources internes du site
      if (
        rawUrl.startsWith("/api/proxy") || 
        rawUrl.startsWith("/get?") || 
        rawUrl.startsWith("./") || 
        rawUrl.startsWith("../") || 
        (rawUrl.startsWith("/") && !rawUrl.startsWith("//") && !rawUrl.startsWith("/item/")) || 
        rawUrl.includes(location.host) ||
        rawUrl.includes(location.origin) ||
        rawUrl.includes("kibangoutv.vercel.app")
      ) {
        return rawUrl;
      }

      // VAVOO, MediaHub, TMDB et flux vidéo M3U8/TS doivent TOUJOURS être proxifiés avec CORS
      if (rawUrl.startsWith("http://") || rawUrl.startsWith("https://")) {
        return `/api/proxy?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }
    window.getProxiedUrl = getProxiedUrl;

    // 1. Interception de XMLHttpRequest (utilisé par Hls.js pour m3u8 et fragments .ts)
    const origXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
      if (typeof url === "string" && (url.startsWith("http://") || url.startsWith("https://"))) {
        url = getProxiedUrl(url);
      }
      return origXhrOpen.call(this, method, url, ...rest);
    };

    // 2. Interception de HTMLMediaElement.src (<video src="...">)
    try {
      const origSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
      if (origSrcDesc && origSrcDesc.set) {
        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          set(val) {
            if (typeof val === "string" && (val.startsWith("http://") || val.startsWith("https://"))) {
              val = getProxiedUrl(val);
            }
            return origSrcDesc.set.call(this, val);
          },
          get() {
            return origSrcDesc.get.call(this);
          }
        });
      }
    } catch(e) {}

    // 3. Enregistrement du Service Worker PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(reg => {
            console.log("KibangouTV Service Worker actif [scope:", reg.scope, "]");
          })
          .catch(err => {
            console.warn("KibangouTV Service Worker notice:", err);
          });
      });
    }

    function wrapFetch(input, init) {
      let isDataCall = false;
      let urlStr = "";
      let options = init || {};

      if (typeof input === "string") {
        urlStr = input;
      } else if (input instanceof URL) {
        urlStr = input.href;
      } else if (input && typeof input.url === "string") {
        urlStr = input.url;
        options = {
          method: input.method || options.method,
          headers: input.headers || options.headers,
          credentials: input.credentials || options.credentials,
          cache: input.cache || options.cache,
          redirect: input.redirect || options.redirect,
          ...init
        };
      } else {
        urlStr = String(input || "");
      }

      if (!urlStr) {
        return nativeFetch(input, init);
      }

      // Détection des appels de données pour activer le loader KibangouTV
      if (
        urlStr.includes("addon") || 
        urlStr.includes("catalog") || 
        urlStr.includes("item") || 
        urlStr.includes("tmdb") || 
        urlStr.includes("vod/source") ||
        urlStr.includes("resolve")
      ) {
        isDataCall = true;
        showGlobalLoader();
      }

      const proxiedUrl = getProxiedUrl(urlStr);
      const promise = nativeFetch(proxiedUrl, options);

      if (urlStr.includes("resolve")) {
        return promise.then(async res => {
          try {
            const clone = res.clone();
            const data = await clone.json();
            if (data && typeof data.url === "string" && !data.url.startsWith("/api/proxy")) {
              data.url = getProxiedUrl(data.url);
              return new Response(JSON.stringify(data), {
                status: res.status,
                statusText: res.statusText,
                headers: res.headers
              });
            }
          } catch(e) {}
          return res;
        }).finally(() => {
          if (isDataCall) hideGlobalLoader();
        });
      }

      if (isDataCall) {
        return promise.finally(() => {
          hideGlobalLoader();
        });
      }
      return promise;
    }

    window.fetch = wrapFetch;
    globalThis.fetch = wrapFetch;

    window.mhub = {
      ready: Promise.resolve(true),
      capabilities: ["fetch", "clientFetch"],
      device: { isTV: false, platform: "windows" },
      fetch(url, options) {
        return wrapFetch(url, options);
      },
      clientFetch(url, options) {
        return wrapFetch(url, options);
      },
      setImmersive() {},
      openSearch() {},
      requestPlayback() {},
      exit() {},
      notify() { return Promise.resolve(); }
    };
  </script>
</head>
<body>

  <!-- ========================================================
       PORTAIL D'AUTHENTIFICATION (LOCK SCREEN)
       ======================================================== -->
  <div id="auth-gate">
    <div class="auth-card" id="auth-card">
      <img src="./logo.svg" alt="KibangouTV" class="auth-logo">
      <div class="auth-brand">Kibangou<span>TV</span></div>
      
      <!-- Vue Code PIN -->
      <div id="view-pin" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="auth-title">Code secret d'accès</div>
        <div class="auth-subtitle">Entrez votre code à 6 chiffres pour déverrouiller l'application</div>
        
        <div class="pin-display" id="pin-display">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>

        <div class="auth-error" id="pin-error"></div>

        <div class="pin-keypad">

  <script>
    /* ========================================================
       LOGIQUE D'AUTHENTIFICATION & SÉCURITÉ
       ======================================================== */
    (function initAuth() {
      const authGate = document.getElementById("auth-gate");
      const authCard = document.getElementById("auth-card");
      const viewPin = document.getElementById("view-pin");
      const viewEmail = document.getElementById("view-email");
      const btnSwitchToEmail = document.getElementById("btn-switch-to-email");
      const btnSwitchToPin = document.getElementById("btn-switch-to-pin");
      const pinDots = document.querySelectorAll("#pin-display .pin-dot");
      const pinError = document.getElementById("pin-error");
      const emailForm = document.getElementById("email-form");
      const emailInput = document.getElementById("auth-email-input");
      const emailError = document.getElementById("email-error");

      const MASTER_PIN = localStorage.getItem("kibangoutv_custom_pin") || "123456";
      let enteredPin = "";

      const existingAuth = localStorage.getItem("kibangoutv_auth");
      if (existingAuth) {
        authGate.classList.add("unlocked");
        authGate.style.display = "none";
      }

      const isMobileOrStandalone = (
        window.__TAURI__ ||
        window.Capacitor ||
        window.process?.type ||
        window.matchMedia("(display-mode: standalone)").matches ||
        /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)
      );

      function showMode(mode) {
        if (mode === "email") {
          viewPin.style.display = "none";
          viewEmail.style.display = "flex";
          emailInput.focus();
        } else {
          viewEmail.style.display = "none";
          viewPin.style.display = "flex";
          enteredPin = "";
          updatePinDots();
        }
      }

      showMode(isMobileOrStandalone ? "pin" : "email");

      btnSwitchToEmail.addEventListener("click", () => showMode("email"));
      btnSwitchToPin.addEventListener("click", () => showMode("pin"));

      function updatePinDots() {
        pinDots.forEach((dot, index) => {
          if (index < enteredPin.length) {
            dot.classList.add("filled");
          } else {
            dot.classList.remove("filled");
          }
        });
      }

      function unlockApp(authType) {
        localStorage.setItem("kibangoutv_auth", authType);
        authGate.classList.add("unlocked");
        setTimeout(() => {
          authGate.style.display = "none";
        }, 300);
      }

      function handlePinInput(digit) {
        if (enteredPin.length >= 6) return;
        enteredPin += digit;
        updatePinDots();
        pinError.textContent = "";

        if (enteredPin.length === 6) {
          if (enteredPin === MASTER_PIN) {
            pinDots.forEach(d => d.style.borderColor = "#00C853");
            setTimeout(() => unlockApp("pin"), 150);
          } else {
            authCard.classList.add("shake");
            pinError.textContent = "Code PIN incorrect (Défaut : 123456)";
            setTimeout(() => {
              authCard.classList.remove("shake");
              enteredPin = "";
              updatePinDots();
            }, 600);
          }
        }
      }

      document.querySelectorAll(".pin-key[data-digit]").forEach(btn => {
        btn.addEventListener("click", () => handlePinInput(btn.getAttribute("data-digit")));
      });

      document.getElementById("pin-del").addEventListener("click", () => {
        if (enteredPin.length > 0) {
          enteredPin = enteredPin.slice(0, -1);
          updatePinDots();
          pinError.textContent = "";
        }
      });

      document.getElementById("pin-clear").addEventListener("click", () => {
        enteredPin = "";
        updatePinDots();
        pinError.textContent = "";
      });

      window.addEventListener("keydown", (e) => {
        if (authGate.style.display === "none" || authGate.classList.contains("unlocked") || viewPin.style.display === "none") return;
        if (/^[0-9]$/.test(e.key)) {
          handlePinInput(e.key);
        } else if (e.key === "Backspace") {
          if (enteredPin.length > 0) {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
          }
        }
      });

      emailForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          unlockApp(email);
        } else {
          emailError.textContent = "Veuillez entrer une adresse e-mail valide.";
        }
      });
    })();
  </script>

  <!-- ========================================================
       APPLICATION KIBANGOUTV (VUMA CORE + NAVIGATION SUR MESURE)
       ======================================================== -->
  <script type="module">
    import { mount } from "https://vuma.mx/latest/app.js";

    // Bouquet local Kibangou TV (URL propre sans injection de query string)
    const bouquetKibangou = new URL("./kibangou-addon/mhub-addon.json", location.href).href;

    mount({
      addons: [
        "https://vavoo.top/live/mhub-addon.json",     // Moteur Live VAVOO (Place 'Live TV' directement après Favoris)
        bouquetKibangou,                              // Bouquet Kibangou (Canal+, beIN, TNT, Télé Congo, Films, Séries)
        "https://www.mhub.mx/tmdb",                   // Moteur TMDB officiel (Requis par vavoo-vod)
        "https://vavoo.top/vod/mhub-addon.json",      // Moteur VAVOO VOD (Résolution des sources de streaming)
        "https://vavoo.top/subtitle/mhub-addon.json"  // Sous-titres
      ],

      addonManager: "hidden",
      locale: "fr",

      links: [
        {
          id: "vavoo",
          name: "VAVOO.TOP",
          icon: "./logo.svg",
          endpoints: [
            "https://vavoo.top",
            "https://www.vavoo.to",
            "https://www.voltop.net"
          ]
        }
      ],

      brand: {
        name: "KibangouTV",
        logo: "./logo.svg",
        icon: "./logo.svg",
        colors: { 
          accent: "#00C853", 
          bg: "#0E1318", 
          text: "#FFFFFF" 
        }
      }
    });

    /* ========================================================
       INJECTION DES BOUTONS 'FILMS' ET 'SÉRIES' DANS LA NAVBAR
       ======================================================== */
    const SVG_FILM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>`;
    const SVG_SERIES = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>`;

    window.performLogout = function() {
      try {
        localStorage.removeItem("kibangoutv_auth");
        localStorage.removeItem("kibangou_auth");
        localStorage.removeItem("kibangou_auth_email");
        localStorage.removeItem("kibangou_auth_time");
        sessionStorage.clear();
      } catch (e) {}

      const authGate = document.getElementById("auth-gate");
      if (authGate) {
        authGate.classList.remove("unlocked");
        authGate.style.display = "flex";
      }
      location.href = location.origin + location.pathname;
    };

    // Gestion de l'installation PWA
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("m-btn-pwa-install");
      if (btn) {
        btn.style.display = "flex";
        btn.onclick = async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === "accepted") {
            btn.style.display = "none";
          }
          deferredPrompt = null;
        };
      }
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      const btn = document.getElementById("m-btn-pwa-install");
      if (btn) btn.style.display = "none";
    });

    function injectCustomNavItems() {
      // 0. Suppression impitoyable du widget Social / Watch Party et du bouton Inviter
      document.querySelectorAll('.sc-track, .sc-slot, .sc-pill, .sc-front, .sc-back, .btn-party, .modal-party, .sv-fab, .feature-dock, .feature-dock-bar, .feature-bar, [class*="sv-fab"], .player-action-invite, [class*="player-action-invite"], button[title*="Inviter"], button[aria-label*="Inviter"], a[href="#/social"]').forEach(el => el.remove());

      // 0b. Liaison du bouton déconnexion mobile
      const mLogout = document.getElementById("m-btn-logout");
      if (mLogout && !mLogout.dataset.bound) {
        mLogout.dataset.bound = "1";
        mLogout.addEventListener("click", performLogout);
      }

      // 1. Redirection automatique du lien Chaînes vers Live TV par défaut
      const channelsItems = document.querySelectorAll('a[href="#/channels"], a[href^="#/channels?"]');
      channelsItems.forEach(item => {
        item.href = "#/channels?src=vavoo-live%2Fchannels";
      });

      // 2. Sidebar (Desktop & Tablette) - Route garantie vers kibangou-direct + bouton déconnexion
      const sidebarNav = document.querySelector(".sidebar-nav");
      if (sidebarNav && !sidebarNav.querySelector("#nav-films")) {
        const channelsItem = sidebarNav.querySelector('a[href^="#/channels"]');
        if (channelsItem) {
          const filmsItem = document.createElement("a");
          filmsItem.id = "nav-films";
          filmsItem.className = "nav-item";
          filmsItem.href = "#/catalog/kibangou-direct/video/movie?name=Films";
          filmsItem.innerHTML = `${SVG_FILM}<span>Films</span>`;
          
          const seriesItem = document.createElement("a");
          seriesItem.id = "nav-series";
          seriesItem.className = "nav-item";
          seriesItem.href = "#/catalog/kibangou-direct/series/series?name=S%C3%A9ries";
          seriesItem.innerHTML = `${SVG_SERIES}<span>Séries</span>`;

          channelsItem.after(seriesItem);
          channelsItem.after(filmsItem);
        }
      }

      // Bouton Déconnexion dans la sidebar desktop
      const sidebarBottom = document.querySelector(".sidebar-bottom");
      if (sidebarBottom && !sidebarBottom.querySelector("#nav-logout")) {
        const logoutItem = document.createElement("a");
        logoutItem.id = "nav-logout";
        logoutItem.className = "nav-item nav-item-logout";
        logoutItem.title = "Se déconnecter";
        logoutItem.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Déconnexion</span>`;
        logoutItem.addEventListener("click", performLogout);
        sidebarBottom.appendChild(logoutItem);
      }

      // 3. Bottom Nav (Mobile)
      const bnav = document.querySelector(".bnav");
      if (bnav) {
        // Masquer Recherche et Paramètres dans la bottom nav sur mobile
        const bnavSearch = bnav.querySelector('a[href="#/search"], a[href*="search"]');
        if (bnavSearch) bnavSearch.style.setProperty('display', 'none', 'important');
        const bnavSettings = bnav.querySelector('a[href="#/settings"], a[href*="settings"]');
        if (bnavSettings) bnavSettings.style.setProperty('display', 'none', 'important');

        if (!bnav.querySelector("#bnav-films")) {
          const bChannels = bnav.querySelector('a[href^="#/channels"]');
          if (bChannels) {
            const bFilms = document.createElement("a");
            bFilms.id = "bnav-films";
            bFilms.className = "bnav-item";
            bFilms.href = "#/catalog/kibangou-direct/video/movie?name=Films";
            bFilms.innerHTML = `${SVG_FILM}<span>Films</span>`;

            const bSeries = document.createElement("a");
            bSeries.id = "bnav-series";
            bSeries.className = "bnav-item";
            bSeries.href = "#/catalog/kibangou-direct/series/series?name=S%C3%A9ries";
            bSeries.innerHTML = `${SVG_SERIES}<span>Séries</span>`;

            bChannels.after(bSeries);
            bChannels.after(bFilms);
          }
        }
      }

      // 4. Positionnement garanti de l'onglet 'Live TV' juste après 'Favoris'
      const allTabs = Array.from(document.querySelectorAll("button, a")).filter(el => {
        const text = (el.textContent || "").trim();
        return text === "Favoris" || text === "Live TV";
      });
      const favTab = allTabs.find(el => el.textContent.trim() === "Favoris");
      const liveTab = allTabs.find(el => el.textContent.trim() === "Live TV");
      if (favTab && liveTab && favTab.parentNode === liveTab.parentNode) {
        if (favTab.nextElementSibling !== liveTab) {
          favTab.after(liveTab);
        }
      }

      // 5. Suppression des éléments Social
      document.querySelectorAll('a[href="#/social"]').forEach(el => el.remove());

      // 6. Nettoyage de la page Réglages (#/settings) et injection de la carte Déconnexion
      if (location.hash.startsWith("#/settings")) {
        document.querySelectorAll(".s-group").forEach(group => {
          const text = group.textContent || "";
          if (text.includes("Social") || text.includes("Watch Parties") || text.includes("Utiliser Social")) {
            group.remove();
          }
          if (text.includes("Supprimer les données de ce site") || text.includes("Delete this site")) {
            group.remove();
          }
        });

        const sContainer = document.querySelector(".settings-view") || document.querySelector(".s-panel") || document.querySelector(".main-inner");
        if (sContainer && !sContainer.querySelector("#settings-logout-card")) {
          const card = document.createElement("div");
          card.id = "settings-logout-card";
          card.style.cssText = "margin: 20px var(--pad, 16px); padding: 18px 20px; border-radius: 16px; background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.25); display: flex; flex-direction: column; gap: 10px;";
          card.innerHTML = `
            <div style="font-weight:700; color:#FFFFFF; font-size:1.05rem;">Compte & Session KibangouTV</div>
            <div style="font-size:0.85rem; color:#8E99A4;">Vous êtes connecté à KibangouTV. Pour verrouiller l'application et exiger à nouveau le code secret, déconnectez-vous.</div>
            <button type="button" id="btn-settings-logout-action" style="margin-top:4px; height:42px; width:fit-content; padding:0 20px; border-radius:10px; border:none; background:#E5484D; color:#FFFFFF; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Se déconnecter
            </button>
          `;
          card.querySelector("#btn-settings-logout-action").addEventListener("click", performLogout);
          sContainer.appendChild(card);
        }
      }

      updateActiveNav();
    }

    function updateActiveNav() {
      const hash = location.hash || "#/";
      const isHome = hash === "#/" || hash === "" || hash.startsWith("#/?");
      document.body.classList.toggle("is-home", isHome);

      const isSearch = hash.startsWith("#/search");
      const isSettings = hash.startsWith("#/settings");
      const mSearch = document.getElementById("m-btn-search");
      const mSettings = document.getElementById("m-btn-settings");
      if (mSearch) mSearch.classList.toggle("active", isSearch);
      if (mSettings) mSettings.classList.toggle("active", isSettings);

      const navFilms = document.getElementById("nav-films");
      const navSeries = document.getElementById("nav-series");
      const bnavFilms = document.getElementById("bnav-films");
      const bnavSeries = document.getElementById("bnav-series");

      const isFilm = hash.includes("video/movie");
      const isSeries = hash.includes("series/series");

      if (navFilms) navFilms.classList.toggle("active", isFilm);
      if (bnavFilms) bnavFilms.classList.toggle("active", isFilm);

      if (navSeries) navSeries.classList.toggle("active", isSeries);
      if (bnavSeries) bnavSeries.classList.toggle("active", isSeries);

      if (isFilm || isSeries) {
        document.querySelectorAll('.sidebar-nav .nav-item:not(#nav-films):not(#nav-series)').forEach(el => el.classList.remove("active"));
        document.querySelectorAll('.bnav .bnav-item:not(#bnav-films):not(#bnav-series)').forEach(el => el.classList.remove("active"));
      }

      // Ajuster le pill indicateur de la bottom nav
      const bnav = document.querySelector(".bnav");
      if (bnav) {
        const visibleItems = Array.from(bnav.querySelectorAll(".bnav-item")).filter(el => {
          return window.getComputedStyle(el).display !== "none";
        });
        if (visibleItems.length > 0) {
          bnav.style.setProperty("--bnav-count", visibleItems.length);
          const activeIdx = visibleItems.findIndex(el => el.classList.contains("active"));
          if (activeIdx >= 0) {
            bnav.style.setProperty("--bnav-active", activeIdx);
          }
        }
      }
    }

    const navObserver = new MutationObserver(() => {
      injectCustomNavItems();
    });
    navObserver.observe(document.body, { childList: true, subtree: true });

    function checkChannelsHash() {
      if (location.hash === "#/channels") {
        location.replace("#/channels?src=vavoo-live%2Fchannels");
      }
    }
    checkChannelsHash();

    window.addEventListener("hashchange", () => {
      checkChannelsHash();
      injectCustomNavItems();
      updateActiveNav();
    });

    setInterval(injectCustomNavItems, 300);

    /* ========================================================
       DÉFILEMENT AUTOMATIQUE DU CARROUSEL HERO (TOUTES LES 6S)
       ======================================================== */
    setInterval(() => {
      const hero = document.querySelector(".hero");
      if (!hero || hero.matches(":hover")) return;

      // Chercher prioritairement les vignettes (hero-strip), sinon les points (hero-dots)
      let targets = Array.from(document.querySelectorAll(".hero-strip .hero-thumb"));
      if (!targets.length) {
        targets = Array.from(document.querySelectorAll(".hero-dots .hero-dot"));
      }
      if (targets.length <= 1) return;

      const activeIdx = targets.findIndex(el => el.classList.contains("active") || el.getAttribute("aria-current") === "true");
      if (activeIdx !== -1) {
        const nextIdx = (activeIdx + 1) % targets.length;
        targets[nextIdx].click();
      }
    }, 6000);
  </script>
</body>
</html>
