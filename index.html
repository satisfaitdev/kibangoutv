  <!-- Polyfill mHub API & bypass de cache corrompu -->
  <script>
    // Nettoyer tout cache d'addon corrompu
    try {
      localStorage.removeItem("vuma_addons_disabled");
      localStorage.removeItem("vuma_addons");
    } catch(e) {}

    const nativeFetch = window.fetch;

    // Contrôleur du loader global KibangouTV
    let pendingRequestsCount = 0;
    let loaderTimer = null;

    function showGlobalLoader() {
      pendingRequestsCount++;
      if (pendingRequestsCount === 1) {
        clearTimeout(loaderTimer);
        loaderTimer = setTimeout(() => {
          if (pendingRequestsCount > 0) {
            const el = document.getElementById("kibangou-global-loader");
            if (el) el.classList.add("is-visible");
          }
        }, 160);
      }
    }

    function hideGlobalLoader() {
      pendingRequestsCount = Math.max(0, pendingRequestsCount - 1);
      if (pendingRequestsCount === 0) {
        clearTimeout(loaderTimer);
        const el = document.getElementById("kibangou-global-loader");
        if (el) el.classList.remove("is-visible");
      }
    }

    function getProxiedUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string") return rawUrl;

      if (
        rawUrl.startsWith("/api/") ||
        rawUrl.startsWith("/get?") ||
        rawUrl.startsWith("./") ||
        rawUrl.startsWith("../") ||
        (rawUrl.startsWith("/") && !rawUrl.startsWith("//") && !rawUrl.startsWith("/item/")) ||
        rawUrl.includes(location.host) ||
        rawUrl.includes(location.origin) ||
        rawUrl.includes("kibangoutv.vercel.app")
      ) {
        return rawUrl;
      }

      if (rawUrl.startsWith("http://") || rawUrl.startsWith("https://")) {
        return `/api/proxy?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }
    window.getProxiedUrl = getProxiedUrl;

    function toBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    // Repli Mixed-Content strict uniquement pour les flux HTTP non-routés sur page HTTPS
    const origXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
      if (typeof url === "string" && location.protocol === "https:" && url.startsWith("http://")) {
        url = `/api/stream?u=${encodeURIComponent(url)}`;
      }
      return origXhrOpen.call(this, method, url, ...rest);
    };

    try {
      const origSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
      if (origSrcDesc && origSrcDesc.set) {
        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          set(val) {
            if (typeof val === "string" && location.protocol === "https:" && val.startsWith("http://")) {
              val = `/api/stream?u=${encodeURIComponent(val)}`;
            }
            return origSrcDesc.set.call(this, val);
          },
          get() {
            return origSrcDesc.get.call(this);
          }
        });
      }
    } catch(e) {}

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(reg => {
            reg.update().catch(() => {});
            console.log("KibangouTV Service Worker actif [scope:", reg.scope, "]");
          })
          .catch(err => {
            console.warn("KibangouTV Service Worker notice:", err);
          });
      });
    }

    function normalizeHeadersObj(h) {
      const out = {};
      if (!h) return out;
      if (typeof Headers !== "undefined" && h instanceof Headers) {
        h.forEach((v, k) => { out[k] = v; });
      } else if (Array.isArray(h)) {
        for (const [k, v] of h) { if (k && v != null) out[k] = String(v); }
      } else if (typeof h === "object") {
        for (const [k, v] of Object.entries(h)) { if (v != null) out[k] = String(v); }
      }
      return out;
    }

    function wrapFetch(input, init) {
      let isDataCall = false;
      let urlStr = "";
      let options = init ? { ...init } : {};

      if (typeof input === "string") {
        urlStr = input;
      } else if (input instanceof URL) {
        urlStr = input.href;
      } else if (input && typeof input.url === "string") {
        urlStr = input.url;
        options = {
          method: input.method || options.method,
          headers: options.headers || input.headers,
          credentials: options.credentials || input.credentials,
          cache: options.cache || input.cache,
          redirect: options.redirect || input.redirect,
          ...options
        };
      } else {
        urlStr = String(input || "");
      }

      if (!urlStr) {
        return nativeFetch(input, init);
      }

      if (
        urlStr.includes("addon") ||
        urlStr.includes("catalog") ||
        urlStr.includes("item") ||
        urlStr.includes("tmdb") ||
        urlStr.includes("vod/source") ||
        urlStr.includes("resolve") ||
        urlStr.includes("client-fetch")
      ) {
        isDataCall = true;
        showGlobalLoader();
      }

      if (urlStr.includes("/adult-addon/catalog/") && !urlStr.includes("pin=")) {
        const pin = localStorage.getItem("kibangou_pro_pin") || "8888";
        const sep = urlStr.includes("?") ? "&" : "?";
        urlStr += `${sep}pin=${encodeURIComponent(pin)}&pro=1`;
      }

      const proxiedUrl = getProxiedUrl(urlStr);
      const isProxied = proxiedUrl !== urlStr && proxiedUrl.startsWith("/api/proxy");

      if (isProxied && options.headers) {
        const customHeaders = normalizeHeadersObj(options.headers);
        const safeHeaders = {};
        if (customHeaders["content-type"] || customHeaders["Content-Type"]) {
          safeHeaders["Content-Type"] = customHeaders["content-type"] || customHeaders["Content-Type"];
        }
        if (Object.keys(customHeaders).length > 0) {
          safeHeaders["X-Proxy-Headers"] = JSON.stringify(customHeaders);
        }
        options.headers = safeHeaders;
      }

      const promise = nativeFetch(proxiedUrl, options).then((res) => {
        const realUrl = res.headers.get("X-Final-Url");
        if (realUrl && isProxied) {
          try {
            Object.defineProperty(res, "url", { value: realUrl, configurable: true });
          } catch {}
        }
        return res;
      });

      if (isDataCall) {
        return promise.finally(() => {
          hideGlobalLoader();
        });
      }
      return promise;
    }

    window.fetch = wrapFetch;
    globalThis.fetch = wrapFetch;

    window.mhub = {
      ready: Promise.resolve(true),
      capabilities: ["fetch", "clientFetch", "streamProxy"],
      device: { isTV: false, platform: /Android|iPhone|iPad/i.test(navigator.userAgent) ? "mobile" : "windows" },
      fetch(url, options) {
        return wrapFetch(url, options);
      },
      clientFetch(url, options) {
        return wrapFetch(url, options);
      },
      openStream({ url, headers } = {}) {
        let base = "/api/stream";
        const hdrObj = normalizeHeadersObj(headers);
        if (Object.keys(hdrObj).length > 0) {
          base = `/api/stream/h_${toBase64Url(JSON.stringify(hdrObj))}`;
        }
        return Promise.resolve({
          base,
          entry: `${base}?u=${encodeURIComponent(url || "")}`
        });
      },
      setImmersive() {},
      openSearch() {},
      requestPlayback() {},
      exit() {},
      notify() { return Promise.resolve(); }
    };
  </script>

  <script>
    /* ========================================================
       LOGIQUE D'AUTHENTIFICATION & SÉCURITÉ
       ======================================================== */
    (function initAuth() {
      const authGate = document.getElementById("auth-gate");
      const authCard = document.getElementById("auth-card");
      const viewPin = document.getElementById("view-pin");
      const viewEmail = document.getElementById("view-email");
      const btnSwitchToEmail = document.getElementById("btn-switch-to-email");
      const btnSwitchToPin = document.getElementById("btn-switch-to-pin");
      const pinDots = document.querySelectorAll("#pin-display .pin-dot");
      const pinError = document.getElementById("pin-error");
      const emailForm = document.getElementById("email-form");
      const emailInput = document.getElementById("auth-email-input");
      const emailError = document.getElementById("email-error");

      const MASTER_PIN = localStorage.getItem("kibangoutv_custom_pin") || "123456";
      let enteredPin = "";

      const existingAuth = localStorage.getItem("kibangoutv_auth");
      if (existingAuth) {
        authGate.classList.add("unlocked");
        authGate.style.display = "none";
      }

      const isMobileOrStandalone = (
        window.__TAURI__ ||
        window.Capacitor ||
        window.process?.type ||
        window.matchMedia("(display-mode: standalone)").matches ||
        /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)
      );

      function showMode(mode) {
        if (mode === "email") {
          viewPin.style.display = "none";
          viewEmail.style.display = "flex";
          emailInput.focus();
        } else {
          viewEmail.style.display = "none";
          viewPin.style.display = "flex";
          enteredPin = "";
          updatePinDots();
        }
      }

      showMode(isMobileOrStandalone ? "pin" : "email");

      btnSwitchToEmail.addEventListener("click", () => showMode("email"));
      btnSwitchToPin.addEventListener("click", () => showMode("pin"));

      function updatePinDots() {
        pinDots.forEach((dot, index) => {
          if (index < enteredPin.length) {
            dot.classList.add("filled");
          } else {
            dot.classList.remove("filled");
          }
        });
      }

      function unlockApp(authType) {
        localStorage.setItem("kibangoutv_auth", authType);
        authGate.classList.add("unlocked");
        setTimeout(() => {
          authGate.style.display = "none";
        }, 300);
      }

      function handlePinInput(digit) {
        if (enteredPin.length >= 6) return;
        enteredPin += digit;
        updatePinDots();
        pinError.textContent = "";

        if (enteredPin.length === 6) {
          if (enteredPin === MASTER_PIN) {
            pinDots.forEach(d => d.style.borderColor = "#00C853");
            setTimeout(() => unlockApp("pin"), 150);
          } else {
            authCard.classList.add("shake");
            pinError.textContent = "Code PIN incorrect (Défaut : 123456)";
            setTimeout(() => {
              authCard.classList.remove("shake");
              enteredPin = "";
              updatePinDots();
            }, 600);
          }
        }
      }

      document.querySelectorAll(".pin-key[data-digit]").forEach(btn => {
        btn.addEventListener("click", () => handlePinInput(btn.getAttribute("data-digit")));
      });

      document.getElementById("pin-del").addEventListener("click", () => {
        if (enteredPin.length > 0) {
          enteredPin = enteredPin.slice(0, -1);
          updatePinDots();
          pinError.textContent = "";
        }
      });

      document.getElementById("pin-clear").addEventListener("click", () => {
        enteredPin = "";
        updatePinDots();
        pinError.textContent = "";
      });

      window.addEventListener("keydown", (e) => {
        if (authGate.style.display === "none" || authGate.classList.contains("unlocked") || viewPin.style.display === "none") return;
        if (/^[0-9]$/.test(e.key)) {
          handlePinInput(e.key);
        } else if (e.key === "Backspace") {
          if (enteredPin.length > 0) {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
          }
        }
      });

      emailForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          unlockApp(email);
        } else {
          emailError.textContent = "Veuillez entrer une adresse e-mail valide.";
        }
      });
    })();
  </script>

        mLogout.addEventListener("click", performLogout);
      }

      // 1. Redirection automatique du lien Chaînes vers Live TV par défaut
      const channelsItems = document.querySelectorAll('a[href="#/channels"], a[href^="#/channels?"]');
      channelsItems.forEach(item => {
        item.href = "#/channels?src=vavoo-live%2Fchannels";
      });

      // 2. Sidebar (Desktop & Tablette) - Route garantie vers kibangou-direct + bouton déconnexion
      const sidebarNav = document.querySelector(".sidebar-nav");
      if (sidebarNav && !sidebarNav.querySelector("#nav-films")) {
        const channelsItem = sidebarNav.querySelector('a[href^="#/channels"]');
        if (channelsItem) {
          const filmsItem = document.createElement("a");
          filmsItem.id = "nav-films";
          filmsItem.className = "nav-item";
          filmsItem.href = "#/catalog/kibangou-direct/video/movie?name=Films";
          filmsItem.innerHTML = `${SVG_FILM}<span>Films</span>`;
          
          const seriesItem = document.createElement("a");
          seriesItem.id = "nav-series";
          seriesItem.className = "nav-item";
          seriesItem.href = "#/catalog/kibangou-direct/series/series?name=S%C3%A9ries";
          seriesItem.innerHTML = `${SVG_SERIES}<span>Séries</span>`;

          channelsItem.after(seriesItem);
          channelsItem.after(filmsItem);
        }
      }

      // Bouton Déconnexion dans la sidebar desktop
      const sidebarBottom = document.querySelector(".sidebar-bottom");
      if (sidebarBottom && !sidebarBottom.querySelector("#nav-logout")) {
        const logoutItem = document.createElement("a");
        logoutItem.id = "nav-logout";
        logoutItem.className = "nav-item nav-item-logout";
        logoutItem.title = "Se déconnecter";
        logoutItem.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Déconnexion</span>`;
        logoutItem.addEventListener("click", performLogout);
        sidebarBottom.appendChild(logoutItem);
      }

      // 3. Bottom Nav (Mobile)
      const bnav = document.querySelector(".bnav");
      if (bnav) {
        // Suppression définitive de Recherche et Paramètres dans la bottom nav sur mobile
        const bnavSearch = bnav.querySelector('a[href="#/search"], a[href*="search"]');
        if (bnavSearch) bnavSearch.remove();
        const bnavSettings = bnav.querySelector('a[href="#/settings"], a[href*="settings"]');
        if (bnavSettings) bnavSettings.remove();

        if (!bnav.querySelector("#bnav-films")) {
          const bChannels = bnav.querySelector('a[href^="#/channels"]');
          if (bChannels) {
            const bFilms = document.createElement("a");
            bFilms.id = "bnav-films";
            bFilms.className = "bnav-item";
            bFilms.href = "#/catalog/kibangou-direct/video/movie?name=Films";
            bFilms.innerHTML = `${SVG_FILM}<span>Films</span>`;

            const bSeries = document.createElement("a");
            bSeries.id = "bnav-series";
            bSeries.className = "bnav-item";
            bSeries.href = "#/catalog/kibangou-direct/series/series?name=S%C3%A9ries";
            bSeries.innerHTML = `${SVG_SERIES}<span>Séries</span>`;

            bChannels.after(bSeries);
            bChannels.after(bFilms);
          }
        }
      }

      // 4. Positionnement garanti de l'onglet 'Live TV' juste après 'Favoris'
      const allTabs = Array.from(document.querySelectorAll("button, a")).filter(el => {
        const text = (el.textContent || "").trim();
        return text === "Favoris" || text === "Live TV";
      });
      const favTab = allTabs.find(el => el.textContent.trim() === "Favoris");
      const liveTab = allTabs.find(el => el.textContent.trim() === "Live TV");
      if (favTab && liveTab && favTab.parentNode === liveTab.parentNode) {
        if (favTab.nextElementSibling !== liveTab) {
          favTab.after(liveTab);
        }
      }

      // 5. Suppression impitoyable des éléments Social, bouton flottant et bouton Inviter du player
      document.querySelectorAll('a[href="#/social"], .player-action-invite, [class*="player-action-invite"], button[data-key="i"], button[data-key="I"], button[aria-label*="Inviter"], button[aria-label*="invit"], .sc-track, .sc-slot, .sc-pill, .sc-covers, .sc-plus, .sc-badge').forEach(el => el.remove());

      // 6. Nettoyage de la page Réglages (#/settings) et injection de la carte Déconnexion
      if (location.hash.startsWith("#/settings")) {
        document.querySelectorAll(".s-group").forEach(group => {
          const text = group.textContent || "";
          if (text.includes("Social") || text.includes("Watch Parties") || text.includes("Utiliser Social")) {
            group.remove();
          }
          if (text.includes("Supprimer les données de ce site") || text.includes("Delete this site")) {
            group.remove();
          }
        });

        const sContainer = document.querySelector(".settings-view") || document.querySelector(".s-panel") || document.querySelector(".main-inner");
        if (sContainer && !sContainer.querySelector("#settings-pro-adult-card")) {
          const isProAdult = localStorage.getItem("kibangou_pro_adult_unlocked") === "true";
          const adultCard = document.createElement("div");
          adultCard.id = "settings-pro-adult-card";
          adultCard.style.cssText = "margin: 20px var(--pad, 16px); padding: 18px 20px; border-radius: 16px; background: rgba(0, 200, 83, 0.06); border: 1px solid rgba(0, 200, 83, 0.25); display: flex; flex-direction: column; gap: 12px;";
          
          if (isProAdult) {
            adultCard.innerHTML = `
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="font-weight:700; color:#FFFFFF; font-size:1.05rem; display:flex; align-items:center; gap:8px;">
                  <span>🔞 Espace Adulte +18 (Abonnement Pro)</span>
                </div>
                <span style="font-size:0.75rem; background:#00C853; color:#0E1318; padding:3px 10px; border-radius:12px; font-weight:800; text-transform:uppercase;">Actif</span>
              </div>
              <div style="font-size:0.85rem; color:#8E99A4;">Le catalogue VOD adulte et les chaînes directes +18 sont déverrouillés sur cet appareil.</div>
              <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
                <a href="#/catalog/kibangou-adult-pro/live/adult-channels?name=Cha%C3%AEnes%20%2B18" style="height:38px; padding:0 16px; border-radius:8px; background:#00C853; color:#0E1318; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:0.85rem;">
                  Accéder aux chaînes +18 →
                </a>
                <button type="button" id="btn-lock-adult" style="height:38px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:transparent; color:#FFFFFF; font-weight:600; cursor:pointer; font-size:0.85rem;">
                  🔒 Verrouiller immédiatement
                </button>
              </div>
            `;
          } else {
            adultCard.innerHTML = `
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="font-weight:700; color:#FFFFFF; font-size:1.05rem;">
                  <span>🔞 Espace Adulte +18 (Abonnement Pro)</span>
                </div>
                <span style="font-size:0.75rem; background:rgba(255,255,255,0.12); color:#8E99A4; padding:3px 10px; border-radius:12px; font-weight:700;">Verrouillé</span>
              </div>
              <div style="font-size:0.85rem; color:#8E99A4;">L'accès aux chaînes directes +18 et films VOD adultes nécessite l'activation Pro ou la saisie de votre code PIN parental (Code par défaut : <strong>8888</strong>).</div>
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px;">
                <input type="password" id="input-pro-adult-pin" placeholder="Code PIN (8888)" maxlength="6" style="height:38px; width:160px; border-radius:8px; border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.3); color:#FFF; padding:0 12px; font-size:0.95rem; text-align:center; letter-spacing:2px;">
                <button type="button" id="btn-unlock-adult" style="height:38px; padding:0 18px; border-radius:8px; border:none; background:#00C853; color:#0E1318; font-weight:700; cursor:pointer; font-size:0.85rem;">
                  Déverrouiller
                </button>
                <button type="button" id="btn-request-pro" style="height:38px; padding:0 14px; border-radius:8px; border:1px solid rgba(0,200,83,0.4); background:rgba(0,200,83,0.1); color:#00C853; font-weight:600; cursor:pointer; font-size:0.85rem;">
                  Demande d'accès Pro
                </button>
              </div>
              <div id="pro-adult-feedback" style="font-size:0.8rem; color:#F87171; display:none;"></div>
            `;
          }

          sContainer.appendChild(adultCard);

          const btnLock = adultCard.querySelector("#btn-lock-adult");
          if (btnLock) {
            btnLock.addEventListener("click", () => {
              localStorage.removeItem("kibangou_pro_adult_unlocked");
              location.reload();
            });
          }

          const btnUnlock = adultCard.querySelector("#btn-unlock-adult");
          if (btnUnlock) {
            btnUnlock.addEventListener("click", () => {
              const input = adultCard.querySelector("#input-pro-adult-pin");
              const feedback = adultCard.querySelector("#pro-adult-feedback");
              const val = (input?.value || "").trim();
              const validPins = ["8888", "1234", "123456", "0000", localStorage.getItem("kibangoutv_custom_pin") || "123456"];
              if (validPins.includes(val)) {
                localStorage.setItem("kibangou_pro_adult_unlocked", "true");
                localStorage.setItem("kibangou_pro_pin", val);
                location.reload();
              } else {
                if (feedback) {
                  feedback.style.display = "block";
                  feedback.textContent = "Code PIN incorrect (Code par défaut : 8888).";
                }
              }
            });
          }

          const btnReq = adultCard.querySelector("#btn-request-pro");
          if (btnReq) {
            btnReq.addEventListener("click", () => {
              alert("Pour activer votre bouquet Adulte +18 Abonnement Pro KibangouTV, utilisez le code PIN parental par défaut : 8888 ou contactez le support KibangouTV.");
            });
          }
        }

        if (sContainer && !sContainer.querySelector("#settings-logout-card")) {
          const card = document.createElement("div");
          card.id = "settings-logout-card";
          card.style.cssText = "margin: 20px var(--pad, 16px); padding: 18px 20px; border-radius: 16px; background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.25); display: flex; flex-direction: column; gap: 10px;";
          card.innerHTML = `
            <div style="font-weight:700; color:#FFFFFF; font-size:1.05rem;">Compte & Session KibangouTV</div>
            <div style="font-size:0.85rem; color:#8E99A4;">Vous êtes connecté à KibangouTV. Pour verrouiller l'application et exiger à nouveau le code secret, déconnectez-vous.</div>
            <button type="button" id="btn-settings-logout-action" style="margin-top:4px; height:42px; width:fit-content; padding:0 20px; border-radius:10px; border:none; background:#E5484D; color:#FFFFFF; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Se déconnecter
            </button>
          `;
          card.querySelector("#btn-settings-logout-action").addEventListener("click", performLogout);
          sContainer.appendChild(card);
        }
      }

      updateActiveNav();
    }

    function updateActiveNav() {
      const hash = location.hash || "#/";
      const isHome = hash === "#/" || hash === "" || hash.startsWith("#/?");
      document.body.classList.toggle("is-home", isHome);

      const isSearch = hash.startsWith("#/search");
      const isSettings = hash.startsWith("#/settings");
      const mSearch = document.getElementById("m-btn-search");
      const mSettings = document.getElementById("m-btn-settings");
      if (mSearch) mSearch.classList.toggle("active", isSearch);
      if (mSettings) mSettings.classList.toggle("active", isSettings);

      const navFilms = document.getElementById("nav-films");
      const navSeries = document.getElementById("nav-series");
      const bnavFilms = document.getElementById("bnav-films");
      const bnavSeries = document.getElementById("bnav-series");

      const isFilm = hash.includes("video/movie");
      const isSeries = hash.includes("series/series");

      if (navFilms) navFilms.classList.toggle("active", isFilm);
      if (bnavFilms) bnavFilms.classList.toggle("active", isFilm);

      if (navSeries) navSeries.classList.toggle("active", isSeries);
      if (bnavSeries) bnavSeries.classList.toggle("active", isSeries);

      if (isFilm || isSeries) {
        document.querySelectorAll('.sidebar-nav .nav-item:not(#nav-films):not(#nav-series)').forEach(el => el.classList.remove("active"));
        document.querySelectorAll('.bnav .bnav-item:not(#bnav-films):not(#bnav-series)').forEach(el => el.classList.remove("active"));
      }

      // Ajuster le pill indicateur de la bottom nav
      const bnav = document.querySelector(".bnav");
      if (bnav) {
        const visibleItems = Array.from(bnav.querySelectorAll(".bnav-item")).filter(el => {
          return window.getComputedStyle(el).display !== "none";
        });
        if (visibleItems.length > 0) {
          bnav.style.setProperty("--bnav-count", visibleItems.length);
          const activeIdx = visibleItems.findIndex(el => el.classList.contains("active"));
          if (activeIdx >= 0) {
            bnav.style.setProperty("--bnav-active", activeIdx);
          }
        }
      }
    }

    /* ========================================================
       SÉLECTEUR & CONVERTISSEUR DE QUALITÉ ADAPTATIF (ABR)
       ======================================================== */
    const QUALITY_OPTIONS = [
      { id: "auto", label: "Auto", badge: "2G/3G", desc: "Débit adaptatif (anti-coupure)" },
      { id: "1080p", label: "1080p", badge: "FHD", desc: "Full HD (Fibre & 4G)" },
      { id: "720p", label: "720p", badge: "HD", desc: "Haute définition équilibrée" },
      { id: "480p", label: "480p", badge: "SD", desc: "Standard (Recommandé 3G)" },
      { id: "360p", label: "360p", badge: "Éco", desc: "Économie de données (2G/3G faible)" }
    ];

    let currentSelectedQuality = localStorage.getItem("kibangoutv_preferred_quality") || "auto";
    let isQualityMenuOpen = false;

    window.setKibangouQuality = function(qualityId, save = true) {
      currentSelectedQuality = qualityId;
      if (save) {
        try {
          localStorage.setItem("kibangoutv_preferred_quality", qualityId);
        } catch(e) {}
      }

      const hls = window.__kibangouHls;
      if (hls) {
        if (typeof hls.setQualityLevel === "function") {
          hls.setQualityLevel(qualityId);
        } else if (hls.levels) {
          if (qualityId === "auto") {
            hls.currentLevel = -1;
            hls.loadLevel = -1;
            hls.nextLevel = -1;
          } else {
            const targetH = parseInt(qualityId, 10);
            if (!isNaN(targetH) && hls.levels.length > 0) {
              let bestIdx = 0;
              let minDiff = Infinity;
              hls.levels.forEach((lvl, idx) => {
                const diff = Math.abs((lvl.height || 0) - targetH);
                if (diff < minDiff) {
                  minDiff = diff;
                  bestIdx = idx;
                }
              });
              hls.currentLevel = bestIdx;
              hls.loadLevel = bestIdx;
              hls.nextLevel = bestIdx;
            }
          }
        }
      }

      const labelEl = document.getElementById("kibangou-quality-current-label");
      if (labelEl) {
        labelEl.textContent = qualityId === "auto" ? "Auto" : qualityId;
      }

      document.querySelectorAll(".kibangou-quality-menu .kibangou-menu-item").forEach(item => {
        item.classList.toggle("active", item.dataset.quality === qualityId);
      });
    };

    function closeQualityMenu() {
      const menu = document.getElementById("kibangou-quality-menu");
      if (menu) menu.remove();
      const btn = document.getElementById("kibangou-quality-btn");
      if (btn) btn.classList.remove("active");
      isQualityMenuOpen = false;
    }

    function toggleQualityMenu() {
      const existing = document.getElementById("kibangou-quality-menu");
      if (existing) {
        closeQualityMenu();
        return;
      }

      const playerControls = document.querySelector(".player-controls") || document.querySelector(".player-root");
      if (!playerControls) return;

      const menu = document.createElement("div");
      menu.id = "kibangou-quality-menu";
      menu.className = "player-menu player-menu-quality kibangou-quality-menu";
      menu.setAttribute("role", "menu");

      menu.innerHTML = `
        <div class="kibangou-menu-header">
          <div class="kibangou-menu-title">Qualité vidéo</div>
          <span class="kibangou-abr-indicator" title="Adaptive Bitrate actif pour éviter toute coupure">ABR 2G/3G</span>
        </div>
        <div class="kibangou-menu-items">
          ${QUALITY_OPTIONS.map(opt => `
            <div class="kibangou-menu-item ${opt.id === currentSelectedQuality ? "active" : ""}" data-quality="${opt.id}" role="menuitem" tabindex="0">
              <div class="kibangou-item-content">
                <span class="kibangou-item-label">${opt.label}</span>
                <span class="res-sub">${opt.desc}</span>
              </div>
              <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          `).join("")}
        </div>
      `;

      menu.querySelectorAll(".kibangou-menu-item").forEach(item => {
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          const q = item.dataset.quality;
          window.setKibangouQuality(q);
          closeQualityMenu();
        });
      });

      playerControls.appendChild(menu);
      const btn = document.getElementById("kibangou-quality-btn");
      if (btn) btn.classList.add("active");
      isQualityMenuOpen = true;
    }

    function injectQualitySelector() {
      const barRight = document.querySelector(".player-bar-right");
      if (!barRight) {
        if (isQualityMenuOpen) closeQualityMenu();
        return;
      }

      // Masquer l'éventuel sélecteur natif Vuma pour éviter le doublon
      const nativeQualityBtn = barRight.querySelector('.player-ctrl-btn[aria-label="Quality"], .player-ctrl-btn[aria-label="Qualité"]');
      if (nativeQualityBtn && !nativeQualityBtn.classList.contains("kibangou-quality-btn")) {
        nativeQualityBtn.style.display = "none";
      }

      if (barRight.querySelector("#kibangou-quality-btn")) return;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = "kibangou-quality-btn";
      btn.className = "player-ctrl-btn kibangou-quality-btn";
      btn.setAttribute("aria-label", "Qualité vidéo");
      btn.setAttribute("title", "Qualité & Débit adaptatif ABR (Auto, 1080p, 720p, 480p, 360p)");
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"></rect>
          <path d="M7 15h2l2-6h-2z"></path>
          <path d="M14 9h3a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-3z"></path>
        </svg>
        <span class="kibangou-quality-label" id="kibangou-quality-current-label">
          ${currentSelectedQuality === "auto" ? "Auto" : currentSelectedQuality}
        </span>
      `;

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleQualityMenu();
      });

      const speedBtn = barRight.querySelector(".player-speed-btn");
      if (speedBtn) {
        speedBtn.after(btn);
      } else {
        barRight.prepend(btn);
      }
    }

    window.addEventListener("click", (e) => {
      if (isQualityMenuOpen) {
        const menu = document.getElementById("kibangou-quality-menu");
        const btn = document.getElementById("kibangou-quality-btn");
        if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
          closeQualityMenu();
        }
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isQualityMenuOpen) {
        closeQualityMenu();
      }
    });

    window.addEventListener("kibangou-quality-switched", (e) => {
      if (currentSelectedQuality === "auto") {
        const lvl = e.detail && e.detail.level;
        const hls = e.detail && e.detail.hls;
        if (hls && hls.levels && hls.levels[lvl]) {
          const height = hls.levels[lvl].height;
          const labelEl = document.getElementById("kibangou-quality-current-label");
          if (labelEl) {
            labelEl.textContent = `Auto (${height}p)`;
          }
        }
      }
    });

    const navObserver = new MutationObserver(() => {
      injectCustomNavItems();
      injectQualitySelector();
    });
    navObserver.observe(document.body, { childList: true, subtree: true });

    function checkChannelsHash() {
      if (location.hash === "#/channels") {
        location.replace("#/channels?src=vavoo-live%2Fchannels");
      }
    }
    checkChannelsHash();

    window.addEventListener("hashchange", () => {
      checkChannelsHash();
      injectCustomNavItems();
      injectQualitySelector();
      updateActiveNav();
    });

    setInterval(() => {
      injectCustomNavItems();
      injectQualitySelector();
    }, 300);

    /* ========================================================
       DÉFILEMENT AUTOMATIQUE DU CARROUSEL HERO (TOUTES LES 6S)
       ======================================================== */
    setInterval(() => {
      const hero = document.querySelector(".hero");
      if (!hero || hero.matches(":hover")) return;

      // Chercher prioritairement les vignettes (hero-strip), sinon les points (hero-dots)
      let targets = Array.from(document.querySelectorAll(".hero-strip .hero-thumb"));
      if (!targets.length) {
        targets = Array.from(document.querySelectorAll(".hero-dots .hero-dot"));
      }
      if (targets.length <= 1) return;

      const activeIdx = targets.findIndex(el => el.classList.contains("active") || el.getAttribute("aria-current") === "true");
      if (activeIdx !== -1) {
        const nextIdx = (activeIdx + 1) % targets.length;
        targets[nextIdx].click();
      }
    }, 6000);
  </script>
