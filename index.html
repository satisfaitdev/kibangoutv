<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>KibangouTV - Canal+, beIN Sports, Télé Congo, Films & Séries</title>
  
  <!-- Moteur Vuma -->
  <link rel="stylesheet" href="https://vuma.mx/latest/style.css">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#00C853">
  
  <!-- PWA Manifest & Icônes App -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KibangouTV">
  <meta name="application-name" content="KibangouTV">

  <!-- Prise en charge télécommande TV (D-pad), tactile et PC -->
  <meta name="mhub" content="app dpad">

  <!-- Interception & Configuration ABR (Adaptive Bitrate) Hls.js pour 2G/3G Afrique -->
  <script type="importmap">
  {
    "imports": {
      "https://vuma.mx/latest/hls.mjs": "/kibangou-abr-hls.js",
      "https://vuma.mx/v/1.5.111/hls.mjs": "/kibangou-abr-hls.js"
    }
  }
  </script>

  <style>
    /* ========================================================
       KIBANGOUTV - STYLES GLOBAUX & PERSONNALISATIONS
       ======================================================== */
    :root {
      --accent: #00C853;
      --accent-rgb: 0, 200, 83;
      --bg-dark: #0E1318;
      --surface-dark: #151C24;
      --surface-border: #232D38;
      --text-muted: #8E99A4;
    }

    /* Masquer l'option Social dans la sidebar et la bottom nav */
    a.nav-item[href="#/social"],
    a.bnav-item[href="#/social"],
    .nav-social {
      display: none !important;
    }

    /* Masquer le bouton 'Supprimer les données de ce site' et la section Social dans Profil/Paramètres */
    .s-label-danger,
    div:has(> .s-label-danger),
    .s-group:has(.s-label-danger) {
      display: none !important;
    }

    .s-group[data-group="social"],
    .s-group:has(.s-gicon):has(.toggle) {
      display: none !important;
    }

    /* Suppression stricte des widgets Social / Watch Party (sans jamais masquer .feature-bar/.feature-dock) */
    .sv-fab,
    .modal-social,
    .social-view,
    .btn-party,
    .btn-hero-glass.btn-party,
    .modal-party,
    .player-action-invite,
    [class*="player-action-invite"],
    button[title*="Inviter"],
    button[title*="inviter"],
    button[aria-label*="Inviter"],
    button[aria-label*="inviter"],
    .pt-seat-plus,
    .sc-track,
    .sc-slot,
    .sc-pill,
    .sc-pill-shadow,
    .sc-front,
    .sc-back,
    .sc-covers,
    [class*="sc-track"],
    [class*="sc-slot"],
    [class*="sc-pill"],
    [class*="sv-fab"],
    a[href="#/social"],
    a.nav-item[href="#/social"],
    a.bnav-item[href="#/social"],
    .nav-social {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
    }

    /* Masquer Recherche et Paramètres de la barre du bas (.bnav) */
    .bnav a[href="#/search"],
    .bnav a[href*="search"],
    .bnav a[href="#/settings"],
    .bnav a[href*="settings"] {
      display: none !important;
    }

    /* ========================================================
       EN-TÊTE MOBILE & PWA STANDALONE
       ======================================================== */
    #mobile-top-header {
      display: none;
    }

    @media (max-width: 768px), (display-mode: standalone) {
      #mobile-top-header {
        display: flex !important;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(54px + var(--sat, 0px));
        padding-top: var(--sat, 0px);
        padding-left: 12px;
        padding-right: 12px;
        align-items: center;
        justify-content: space-between;
        background: rgba(14, 19, 24, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 99999 !important;
        box-sizing: border-box;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }

      html.player-open #mobile-top-header {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }

      .app-root > .main {
        padding-top: calc(54px + var(--sat, 0px)) !important;
        box-sizing: border-box !important;
      }

      .sidebar {
        top: calc(54px + var(--sat, 0px) + min(var(--host-solid-top, 0px), var(--rail-gap, 14px))) !important;
      }
    }

    html.pwa-standalone #mobile-top-header {
      display: flex !important;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(54px + var(--sat, 0px));
      padding-top: var(--sat, 0px);
      padding-left: 12px;
      padding-right: 12px;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 19, 24, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 99999 !important;
      box-sizing: border-box;
    }

    html.pwa-standalone .app-root > .main {
      padding-top: calc(54px + var(--sat, 0px)) !important;
      box-sizing: border-box !important;
    }

    html.pwa-standalone .sidebar {
      top: calc(54px + var(--sat, 0px) + min(var(--host-solid-top, 0px), var(--rail-gap, 14px))) !important;
    }

    @media (max-width: 768px) {
      .bnav a[href="#/search"],
      .bnav a[href*="search"],
      .bnav a[href="#/settings"],
      .bnav a[href*="settings"] {
        display: none !important;
      }
    }

    .m-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    body.is-home #m-btn-back {
      display: none !important;
    }

    .m-brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #FFFFFF;
      min-width: 0;
    }

    .m-brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      filter: drop-shadow(0 2px 8px rgba(0, 200, 83, 0.55));
      flex-shrink: 0;
    }

    .m-brand-name {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .m-brand-accent {
      color: var(--accent);
    }

    .m-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .m-header-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #CBD5E1;
      text-decoration: none;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    .m-header-icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .m-header-icon-btn:hover,
    .m-header-icon-btn:active,
    .m-header-icon-btn.active {
      background: rgba(0, 200, 83, 0.18);
      border-color: rgba(0, 200, 83, 0.45);
      color: var(--accent);
      transform: scale(1.04);
    }

    /* Ne jamais bloquer les requêtes/résolutions/lecture avec un overlay plein écran */
    #kibangou-global-loader {
      display: none !important;
      pointer-events: none !important;
    }

    /* Masquer tout bouton manuel de qualité dans le lecteur (100% ABR automatique) */
    .player-bar-right .player-ctrl-btn[data-key="Q"],
    .player-bar-right .player-ctrl-btn[aria-label="Quality"],
    .player-bar-right .player-ctrl-btn[aria-label="Qualité"] {
      display: none !important;
    }

    /* Chaînes : barre de recherche et filtres par catégorie bien visibles */
    .channels-view .feature-bar {
      display: block !important;
      visibility: visible !important;
    }

    .channels-view .controls.ch-controls {
      display: flex !important;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .channels-view .controls .search-wrap {
      flex: 1 1 220px;
      min-width: 180px;
    }

    .channels-view .controls .glass-input,
    .channels-view .controls .sort-select {
      min-height: 40px;
      background-color: rgba(21, 28, 36, 0.92);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.14);
      color-scheme: dark;
    }

    .channels-view .controls .sort-select option {
      background-color: #151C24;
      color: #FFFFFF;
    }

    /* Badges de langue & bouton Télécharger sur VOD */
    .kibangou-lang-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
    }

    .kibangou-lang-badge.lang-vf {
      background: rgba(0, 200, 83, 0.16);
      border-color: rgba(0, 200, 83, 0.42);
      color: #4ADE80;
    }

    .kibangou-lang-badge.lang-vostfr {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.38);
      color: #7DD3FC;
    }

    .kibangou-lang-badge.lang-en {
      background: rgba(148, 163, 184, 0.16);
      border-color: rgba(148, 163, 184, 0.35);
      color: #CBD5E1;
    }

    .kibangou-src-dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 8px;
      padding: 6px 10px;
      min-height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(0, 200, 83, 0.35);
      background: rgba(0, 200, 83, 0.12);
      color: #4ADE80;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.14s ease;
    }

    .kibangou-src-dl-btn:hover,
    .kibangou-src-dl-btn:focus-visible {
      background: rgba(0, 200, 83, 0.24);
      border-color: #00C853;
      color: #FFFFFF;
      outline: none;
    }

    .kibangou-src-dl-btn svg,
    .kibangou-download-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .item-view .btn-hero-glass.kibangou-download-btn {
      width: auto !important;
      padding: 0 16px !important;
      gap: 7px;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
    }

    .item-view .btn-hero-glass.kibangou-download-btn .kibangou-dl-word {
      display: inline !important;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .kibangou-player-dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 10px !important;
      width: auto !important;
      font-size: 12px;
      font-weight: 700;
      color: inherit !important;
    }

    @media (max-width: 768px) {
      .item-view .btn-hero-glass.kibangou-download-btn {
        width: 44px !important;
        min-width: 44px !important;
        padding: 0 !important;
        color: inherit !important;
      }

      .item-view .btn-hero-glass.kibangou-download-btn .kibangou-dl-word,
      .kibangou-player-dl-btn span,
      .kibangou-src-dl-btn span {
        display: none !important;
      }

      .kibangou-player-dl-btn {
        width: 36px !important;
        min-width: 36px !important;
        padding: 0 !important;
        justify-content: center !important;
        color: inherit !important;
      }

      .kibangou-src-dl-btn {
        padding: 6px !important;
        min-width: 32px;
        justify-content: center;
        color: inherit !important;
        background: rgba(255, 255, 255, 0.08) !important;
        border-color: rgba(255, 255, 255, 0.16) !important;
      }
    }

    /* Profil / Paramètres cartes propres sans doublon */
    .settings-groups .kibangou-settings-card {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kibangou-adult-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .kibangou-adult-link {
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: filter 0.16s ease, transform 0.14s ease;
    }

    .kibangou-adult-link:hover {
      filter: brightness(1.08);
    }

    .kibangou-adult-link-primary {
      background: #00C853;
      color: #0E1318;
    }

    .kibangou-adult-link-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
    }

    /* Notifications légères (ABR & Bascule VOD) */
    .kibangou-abr-toast {
      position: fixed;
      top: calc(64px + var(--sat, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: rgba(14, 19, 24, 0.94);
      border: 1px solid rgba(0, 200, 83, 0.45);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 999998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kibangou-abr-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .kibangou-abr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00C853;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .kibangou-abr-toast,
      .m-header-icon-btn,
      .kibangou-src-dl-btn {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ========================================================
       PORTAIL D'AUTHENTIFICATION (PIN 6 CHIFFRES & E-MAIL WEB)
       ======================================================== */
    #auth-gate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at 50% 30%, #151e28 0%, #0a0d12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #auth-gate.unlocked {
      display: none !important;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: rgba(21, 28, 36, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 200, 83, 0.15);
      backdrop-filter: blur(20px);
    }

    .auth-logo {
      width: 68px;
      height: 68px;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 18px rgba(0, 200, 83, 0.4));
    }

    .auth-brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .auth-brand span {
      color: #00C853;
    }

    .auth-title {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .pin-display {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 44px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #00C853;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pin-dot.filled {
      background: rgba(0, 200, 83, 0.12);
      border-color: #00C853;
      box-shadow: 0 0 14px rgba(0, 200, 83, 0.35);
    }

    .pin-dot.filled::after {
      content: "•";
      font-size: 28px;
      color: #00C853;
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 18px;
    }

    .pin-key {
      height: 52px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .pin-key:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .pin-key:active {
      transform: scale(0.94);
      background: rgba(0, 200, 83, 0.2);
    }

    .pin-key.key-action {
      font-size: 14px;
      color: var(--text-muted);
    }

    .email-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .google-auth-btn {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #FFFFFF;
      color: #0F172A;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.16s ease;
      margin-bottom: 14px;
    }

    .google-auth-btn:hover {
      background: #F1F5F9;
      transform: translateY(-1px);
    }

    .auth-divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 11.5px;
      margin-bottom: 14px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .email-input-wrapper {
      position: relative;
      width: 100%;
    }

    .email-input {
      width: 100%;
      box-sizing: border-box;
      height: 48px;
      padding: 0 16px 0 42px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .email-input:focus {
      border-color: #00C853;
      box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.25);
    }

    .email-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .auth-btn {
      height: 48px;
      width: 100%;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00C853 0%, #00963d 100%);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 18px rgba(0, 200, 83, 0.4);
    }

    .auth-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 22px rgba(0, 200, 83, 0.5);
    }

    .auth-btn:active {
      transform: scale(0.98);
    }

    .mode-switch-btn {
      background: none;
      border: none;
      color: #00C853;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s, opacity 0.15s;
    }

    .mode-switch-btn:hover {
      background: rgba(0, 200, 83, 0.1);
    }

    .auth-error {
      font-size: 12px;
      color: #FF5252;
      min-height: 18px;
      margin-bottom: 10px;
      font-weight: 500;
    }

    @keyframes pin-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

  <!-- Polyfill mHub API & bypass de cache corrompu -->
  <script>
    try {
      localStorage.removeItem("vuma_addons_disabled");
      localStorage.removeItem("vuma_addons");
      localStorage.removeItem("kibangoutv_preferred_quality");
    } catch {}

    const nativeFetch = window.fetch;
    window.__kibangouSourceList = [];
    window.__kibangouSourcesByItemId = new Map();
    window.__kibangouSourceMap = new Map();
    window.__kibangouResolvedCache = new Map();
    window.__kibangouCurrentStream = null;
    window.__kibangouAdultManifest = null;

    function getProxiedUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string") return rawUrl;

      if (
        rawUrl.startsWith("/api/") ||
        rawUrl.startsWith("/get?") ||
        rawUrl.startsWith("./") ||
        rawUrl.startsWith("../") ||
        (rawUrl.startsWith("/") && !rawUrl.startsWith("//")) ||
        rawUrl.includes(location.host) ||
        rawUrl.includes(location.origin) ||
        rawUrl.includes("kibangoutv.vercel.app")
      ) {
        return rawUrl;
      }

      if (rawUrl.startsWith("http://") || rawUrl.startsWith("https://")) {
        return `/api/proxy?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }
    window.getProxiedUrl = getProxiedUrl;

    function toBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    window.__kibangouToBase64Url = toBase64Url;

    const origXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...rest) {
      if (typeof url === "string" && location.protocol === "https:" && url.startsWith("http://")) {
        url = `/api/stream?u=${encodeURIComponent(url)}`;
      }
      return origXhrOpen.call(this, method, url, ...rest);
    };

    try {
      const origSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
      if (origSrcDesc && origSrcDesc.set) {
        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          set(val) {
            if (typeof val === "string" && location.protocol === "https:" && val.startsWith("http://")) {
              val = `/api/stream?u=${encodeURIComponent(val)}`;
            }
            return origSrcDesc.set.call(this, val);
          },
          get() {
            return origSrcDesc.get.call(this);
          }
        });
      }
    } catch {}

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(reg => {
            reg.update().catch(() => {});
          })
          .catch(() => {});
      });
    }

    function normalizeHeadersObj(h) {
      const out = {};
      if (!h) return out;
      if (typeof Headers !== "undefined" && h instanceof Headers) {
        h.forEach((v, k) => { out[k] = v; });
      } else if (Array.isArray(h)) {
        for (const [k, v] of h) { if (k && v != null) out[k] = String(v); }
      } else if (typeof h === "object") {
        for (const [k, v] of Object.entries(h)) { if (v != null) out[k] = String(v); }
      }
      return out;
    }

    function recordApiPayload(urlStr, res, reqOptions) {
      try {
        const isSourceFeed = urlStr.includes("/source/");
        const isResolveFeed = urlStr.includes("/resolve") || urlStr.includes("/client-fetch");
        const isAdultManifest = urlStr.includes("/adult-addon/mhub-addon.json");
        if (!isSourceFeed && !isResolveFeed && !isAdultManifest) return;

        res.clone().json().then((data) => {
          if (!data || typeof data !== "object") return;
          if (isAdultManifest && data.id) {
            window.__kibangouAdultManifest = data;
          }
          if (isSourceFeed && Array.isArray(data.sources)) {
            const srcMatch = decodeURIComponent(urlStr).match(/\/source\/(?:video|series)\/([^/?#]+)/i);
            const srcItemKey = srcMatch ? srcMatch[1].replace(/\.json$/i, "") : "";
            if (srcItemKey && window.__kibangouSourcesByItemId) {
              window.__kibangouSourcesByItemId.set(srcItemKey, data.sources);
              const tmdbBase = srcItemKey.split(":").slice(0, 2).join(":");
              if (tmdbBase) window.__kibangouSourcesByItemId.set(tmdbBase, data.sources);
            }
            window.__kibangouSourceList = data.sources;
            for (const s of data.sources) {
              if (!s || !s.url) continue;
              const host = (() => {
                try { return new URL(s.url).hostname.replace(/^www\./, ""); } catch { return ""; }
              })();
              const key = `${(s.name || "").trim()}|${(s.quality || host || "").trim()}`;
              window.__kibangouSourceMap.set(key, s);
              window.__kibangouSourceMap.set(s.url, s);
            }
          }
          if (isResolveFeed && typeof data.url === "string" && data.url) {
            let origSourceUrl = "";
            try {
              const uObj = new URL(urlStr, location.href);
              origSourceUrl = uObj.searchParams.get("url") || "";
            } catch {}
            if (!origSourceUrl && reqOptions && typeof reqOptions.body === "string") {
              try {
                const parsedBody = JSON.parse(reqOptions.body);
                origSourceUrl = parsedBody.sourceUrl || parsedBody.url || "";
              } catch {}
            }
            const entry = {
              url: data.url,
              headers: data.headers || null,
              proxy: Boolean(data.proxy),
              ts: Date.now()
            };
            if (origSourceUrl) {
              window.__kibangouResolvedCache.set(origSourceUrl, entry);
            }
            window.__kibangouResolvedCache.set(data.url, entry);
          }
        }).catch(() => {});
      } catch {}
    }

    function wrapFetch(input, init) {
      let urlStr = "";
      let options = init ? { ...init } : {};

      if (typeof input === "string") {
        urlStr = input;
      } else if (input instanceof URL) {
        urlStr = input.href;
      } else if (input && typeof input.url === "string") {
        urlStr = input.url;
        options = {
          method: input.method || options.method,
          headers: options.headers || input.headers,
          credentials: options.credentials || input.credentials,
          cache: options.cache || input.cache,
          redirect: options.redirect || input.redirect,
          ...options
        };
      } else {
        urlStr = String(input || "");
      }

      if (!urlStr) {
        return nativeFetch(input, init);
      }

      if (urlStr.includes("/adult-addon/catalog/") && !urlStr.includes("pro=1")) {
        const sep = urlStr.includes("?") ? "&" : "?";
        urlStr += `${sep}pro=1`;
      }

      const proxiedUrl = getProxiedUrl(urlStr);
      const isProxied = proxiedUrl !== urlStr && proxiedUrl.startsWith("/api/proxy");

      if (isProxied && options.headers) {
        const customHeaders = normalizeHeadersObj(options.headers);
        const safeHeaders = {};
        if (customHeaders["content-type"] || customHeaders["Content-Type"]) {
          safeHeaders["Content-Type"] = customHeaders["content-type"] || customHeaders["Content-Type"];
        }
        if (Object.keys(customHeaders).length > 0) {
          safeHeaders["X-Proxy-Headers"] = JSON.stringify(customHeaders);
        }
        options.headers = safeHeaders;
      }

      return nativeFetch(proxiedUrl, options).then((res) => {
        const realUrl = res.headers.get("X-Final-Url");
        if (realUrl && isProxied) {
          try {
            Object.defineProperty(res, "url", { value: realUrl, configurable: true });
          } catch {}
        }
        recordApiPayload(urlStr, res, options);
        return res;
      });
    }

    window.fetch = wrapFetch;
    globalThis.fetch = wrapFetch;

    function isEmbedHostUrl(rawUrl) {
      const lower = String(rawUrl || "").toLowerCase();
      if (!lower) return true;
      if (
        lower.includes("/live/play/") ||
        lower.includes("/vod/play/") ||
        lower.includes("dood.") ||
        lower.includes("d000d.") ||
        lower.includes("ds2video.") ||
        lower.includes("dooodster.") ||
        lower.includes("doply.") ||
        lower.includes("vide0.") ||
        lower.includes("vidply") ||
        lower.includes("myvidplay") ||
        lower.includes("voe.sx") ||
        lower.includes("filemoon.") ||
        lower.includes("mixdrop.") ||
        lower.includes("mxdrop.") ||
        lower.includes("m1xdrop.") ||
        lower.includes("miixdrop.") ||
        lower.includes("playmogo.") ||
        lower.includes("supervideo.")
      ) {
        return !/\.(mp4|m4v|mkv|webm|mov|m3u8|ts)(\?|$)/i.test(lower);
      }
      return false;
    }
    window.__kibangouIsEmbedHostUrl = isEmbedHostUrl;

    window.mhub = {
      ready: Promise.resolve(true),
      capabilities: ["fetch", "clientFetch", "streamProxy"],
      device: { isTV: false, platform: /Android|iPhone|iPad/i.test(navigator.userAgent) ? "mobile" : "windows" },
      fetch(url, options) {
        return wrapFetch(url, options);
      },
      clientFetch(url, options) {
        return wrapFetch(url, options);
      },
      openStream({ url, headers } = {}) {
        let base = "/api/stream";
        const hdrObj = normalizeHeadersObj(headers);
        if (Object.keys(hdrObj).length > 0) {
          base = `/api/stream/h_${toBase64Url(JSON.stringify(hdrObj))}`;
        }
        if (url && !isEmbedHostUrl(url)) {
          window.__kibangouCurrentStream = {
            url,
            headers: Object.keys(hdrObj).length > 0 ? hdrObj : null,
            ts: Date.now()
          };
        } else {
          window.__kibangouCurrentStream = null;
        }
        return Promise.resolve({
          base,
          entry: `${base}?u=${encodeURIComponent(url || "")}`
        });
      },
      setImmersive() {},
      openSearch() {},
      requestPlayback() {},
      exit() {},
      notify() { return Promise.resolve(); }
    };
  </script>

  <script>
    /* ========================================================
       LOGIQUE D'AUTHENTIFICATION & SÉCURITÉ
       ======================================================== */
    (function initAuth() {
      const authGate = document.getElementById("auth-gate");
      const authCard = document.getElementById("auth-card");
      const viewPin = document.getElementById("view-pin");
      const viewEmail = document.getElementById("view-email");
      const btnSwitchToEmail = document.getElementById("btn-switch-to-email");
      const btnSwitchToPin = document.getElementById("btn-switch-to-pin");
      const pinDots = document.querySelectorAll("#pin-display .pin-dot");
      const pinError = document.getElementById("pin-error");
      const emailForm = document.getElementById("email-form");
      const emailInput = document.getElementById("auth-email-input");
      const passwordInput = document.getElementById("auth-password-input");
      const emailError = document.getElementById("email-error");
      const emailSubmitBtn = document.getElementById("auth-email-submit");

      const MASTER_PIN = localStorage.getItem("kibangoutv_custom_pin") || "123456";
      let enteredPin = "";

      const existingAuth = localStorage.getItem("kibangoutv_auth");
      if (existingAuth) {
        authGate.classList.add("unlocked");
        authGate.style.display = "none";
      }

      (async function syncServerSession() {
        const sp = new URLSearchParams(location.search);
        const authErr = sp.get("auth_error");
        if (authErr) {
          showMode("email");
          authGate.classList.remove("unlocked");
          authGate.style.display = "flex";
          emailError.textContent = authErr === "google_not_configured"
            ? "Connexion Google prête : ajoutez GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET dans Vercel."
            : "Connexion Google interrompue (" + authErr + ").";
          history.replaceState({}, "", location.pathname + location.hash);
          return;
        }
        try {
          const r = await fetch("/api/auth?action=me", { credentials: "same-origin" });
          if (r.ok) {
            const j = await r.json();
            if (j.authenticated && j.user) {
              localStorage.setItem("kibangoutv_user", JSON.stringify(j.user));
              unlockApp(j.user.email);
              if (sp.has("auth_success")) {
                history.replaceState({}, "", location.pathname + location.hash);
              }
            }
          }
        } catch {}
      })();

      const isMobileOrStandalone = (
        window.__TAURI__ ||
        window.Capacitor ||
        window.process?.type ||
        window.matchMedia("(display-mode: standalone)").matches ||
        /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)
      );

      function showMode(mode) {
        if (mode === "email") {
          viewPin.style.display = "none";
          viewEmail.style.display = "flex";
          emailInput.focus();
        } else {
          viewEmail.style.display = "none";
          viewPin.style.display = "flex";
          enteredPin = "";
          updatePinDots();
        }
      }

      showMode(isMobileOrStandalone ? "pin" : "email");

      btnSwitchToEmail.addEventListener("click", () => showMode("email"));
      btnSwitchToPin.addEventListener("click", () => showMode("pin"));

      function updatePinDots() {
        pinDots.forEach((dot, index) => {
          if (index < enteredPin.length) {
            dot.classList.add("filled");
          } else {
            dot.classList.remove("filled");
          }
        });
      }

      function unlockApp(authType) {
        localStorage.setItem("kibangoutv_auth", authType);
        authGate.classList.add("unlocked");
        setTimeout(() => {
          authGate.style.display = "none";
        }, 300);
      }

      function handlePinInput(digit) {
        if (enteredPin.length >= 6) return;
        enteredPin += digit;
        updatePinDots();
        pinError.textContent = "";

        if (enteredPin.length === 6) {
          if (enteredPin === MASTER_PIN) {
            pinDots.forEach(d => d.style.borderColor = "#00C853");
            setTimeout(() => unlockApp("pin"), 150);
          } else {
            authCard.classList.add("shake");
            pinError.textContent = "Code PIN incorrect (Défaut : 123456)";
            setTimeout(() => {
              authCard.classList.remove("shake");
              enteredPin = "";
              updatePinDots();
            }, 600);
          }
        }
      }

      document.querySelectorAll(".pin-key[data-digit]").forEach(btn => {
        btn.addEventListener("click", () => handlePinInput(btn.getAttribute("data-digit")));
      });

      document.getElementById("pin-del").addEventListener("click", () => {
        if (enteredPin.length > 0) {
          enteredPin = enteredPin.slice(0, -1);
          updatePinDots();
          pinError.textContent = "";
        }
      });

      document.getElementById("pin-clear").addEventListener("click", () => {
        enteredPin = "";
        updatePinDots();
        pinError.textContent = "";
      });

      window.addEventListener("keydown", (e) => {
        if (authGate.style.display === "none" || authGate.classList.contains("unlocked") || viewPin.style.display === "none") return;
        if (/^[0-9]$/.test(e.key)) {
          handlePinInput(e.key);
        } else if (e.key === "Backspace") {
          if (enteredPin.length > 0) {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
          }
        }
      });

    async function downloadHlsAsVideo(m3u8Url, headers, title) {
      const base = sanitizeFilename(title, "video.mp4").replace(/\.[^.]+$/, "");

      let playlistUrl = buildStreamProxyUrl(m3u8Url, headers);
      let res = await fetch(playlistUrl);
      if (!res.ok) throw new Error("Playlist fetch failed");
      let text = await res.text();

      if (text.includes("#EXT-X-STREAM-INF")) {
        const lines = text.split(/\r?\n/);

        let bestBw = -1;
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.startsWith("#EXT-X-STREAM-INF:")) {
            const bwMatch = line.match(/BANDWIDTH=(\d+)/);
            const bw = bwMatch ? Number(bwMatch[1]) : 0;
            const nextLine = (lines[i + 1] || "").trim();
            if (nextLine && !nextLine.startsWith("#") && (bw > bestBw || nextLine.includes("q=orig"))) {
              bestBw = nextLine.includes("q=orig") ? Infinity : bw;
              bestUrl = nextLine.startsWith("http") || nextLine.startsWith("/") ? nextLine : new URL(nextLine, m3u8Url).href;
            }
          }
        }
        if (bestUrl) {
          const r2 = await fetch(bestUrl.startsWith("/api/stream") ? bestUrl : buildStreamProxyUrl(bestUrl, headers));
          if (r2.ok) text = await r2.text();
        }
      }

      if (text.includes("#EXTINF:") && !text.includes("#EXT-X-ENDLIST")) {
        showToast("Ce flux est un direct continu, utilisez un film/série MP4 pour télécharger.");
        return false;
      }

      const segUrls = [];
      let isFmp4 = false;
      for (const rawLine of text.split(/\r?\n/)) {
        const s = rawLine.trim();
        if (!s) continue;
        if (s.startsWith("#EXT-X-MAP:")) {
          isFmp4 = true;
          const m = s.match(/URI="([^"]+)"/);
          if (m && m[1]) {
            segUrls.push(m[1].startsWith("http") || m[1].startsWith("/") ? m[1] : new URL(m[1], m3u8Url).href);
          }
        } else if (!s.startsWith("#")) {
          segUrls.push(s.startsWith("http") || s.startsWith("/") ? s : new URL(s, m3u8Url).href);
        }
      }

      if (!segUrls.length) {
        showToast("Aucun segment vidéo trouvé pour le téléchargement.");
        return false;
      }

      const chunks = new Array(segUrls.length);
      let completed = 0;
      let nextIdx = 0;
      const concurrency = 4;

      async function worker() {
        while (nextIdx < segUrls.length) {
          const idx = nextIdx++;
          const u = segUrls[idx].startsWith("/api/stream") ? segUrls[idx] : buildStreamProxyUrl(segUrls[idx], headers);
          const sr = await fetch(u);
          if (!sr.ok) throw new Error("Segment failed");
          chunks[idx] = await sr.arrayBuffer();
          completed++;
          if (completed === 1 || completed % 25 === 0 || completed === segUrls.length) {
            const pct = Math.round((completed / segUrls.length) * 100);
            showToast(`Téléchargement vidéo : ${pct}%`);
          }
        }
      }

      await Promise.all(Array.from({ length: Math.min(concurrency, segUrls.length) }, worker));
      const ext = isFmp4 ? "mp4" : "ts";
      const outName = `${base}.${ext}`;
      const blob = new Blob(chunks, { type: isFmp4 ? "video/mp4" : "video/mp2t" });
      try { await saveOfflineVideo({ id: base, title, mime: blob.type, blob, size: blob.size, ts: Date.now() }); } catch {}
      if (window.KibangouAndroid && typeof window.KibangouAndroid.saveBase64 === "function") {
        try {
          const reader = new FileReader();
          reader.onloadend = () => {
            const b64 = String(reader.result || "").split(",")[1] || "";
            if (b64) window.KibangouAndroid.saveBase64(outName, b64);

          reader.readAsDataURL(blob);
          showToast(`Vidéo enregistrée dans Téléchargements : ${outName}`);

      triggerDownloadUrl(blobUrl, outName);

    function openOfflineDb() {

        req.onsuccess = () => resolve(req.result);

    async function downloadResolvedVideo(resolved, title) {
      if (!resolved || !resolved.url) return false;
      if (isHlsUrl(resolved.url)) {
        return await downloadHlsAsVideo(resolved.url, resolved.headers, title);
      }
      const dlUrl = buildStreamDownloadUrl(resolved.url, resolved.headers, sanitizeFilename(title, resolved.url));
      try {
        const head = await fetch(dlUrl, { method: "HEAD" });
        const ct = (head.headers.get("content-type") || "").toLowerCase();
        if (ct.includes("mpegurl")) {
          return await downloadHlsAsVideo(resolved.url, resolved.headers, title);
        }
      } catch {}
      const filename = sanitizeFilename(title, resolved.url);
      triggerDownloadUrl(buildStreamDownloadUrl(resolved.url, resolved.headers, filename), filename);
      return true;
    }

    async function resolveSourceToPlayable(sourceUrl) {
      if (!sourceUrl) return null;
      const directPath = sourceUrl.split("?")[0].toLowerCase();
      if (/\.(mp4|m4v|mkv|webm|mov|m3u8|ts)$/i.test(directPath) && !isEmbedHostUrl(sourceUrl)) {
        return { url: sourceUrl, headers: null };
      }

      const cached = window.__kibangouResolvedCache && window.__kibangouResolvedCache.get(sourceUrl);
      if (cached && cached.url && !isEmbedHostUrl(cached.url) && Date.now() - cached.ts < 120000) {
        return cached;
      }

      const res = await fetch(`/resolve?url=${encodeURIComponent(sourceUrl)}`);
      if (!res.ok) return null;
      let data = await res.json();

      let hops = 0;
      while (data && data.clientFetch && hops < 5) {
        hops++;
        const cf = data.clientFetch;
        const cfRes = await fetch(cf.url, {
          method: cf.method || "GET",
          headers: cf.headers || undefined,
          body: cf.body || undefined,
          redirect: cf.redirect || undefined
        });
        const ct = cfRes.headers.get("content-type") || "";
        const isText = ct.includes("text/") || ct.includes("json") || ct.includes("xml") || ct.includes("javascript");
        let bodyStr = "";
        let encoding = "utf-8";
        if (isText) {
          bodyStr = await cfRes.text();
        } else {
          const bytes = new Uint8Array(await cfRes.arrayBuffer());
          let bin = "";
          for (let i = 0; i < bytes.length; i += 8192) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
          }
          bodyStr = btoa(bin);
          encoding = "base64";
        }
        const hdrObj = {};
        cfRes.headers.forEach((v, k) => { hdrObj[k] = v; });

        const postRes = await fetch("/client-fetch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: cf.id,
            status: cfRes.status,
            url: cfRes.url || cf.url,
            headers: hdrObj,
            body: bodyStr,
            encoding
          })
        });
        if (!postRes.ok) return null;
        data = await postRes.json();
      }

      if (data && typeof data.url === "string" && data.url && !isEmbedHostUrl(data.url)) {
        const entry = { url: data.url, headers: data.headers || null, ts: Date.now() };
        if (window.__kibangouResolvedCache) {
          window.__kibangouResolvedCache.set(sourceUrl, entry);
          window.__kibangouResolvedCache.set(data.url, entry);
        }
        return entry;
      }
      return null;
    }

    function parseSourceLanguage(el, meta) {
      const rawLang = (el.dataset.lang || "").toLowerCase();
      const nameText = (el.querySelector(".source-name")?.textContent || "").toLowerCase();
      const detailText = (el.querySelector(".source-detail")?.textContent || "").toLowerCase();
      const existingLang = (el.querySelector(".source-langs")?.textContent || "").toLowerCase();
      const metaLangs = Array.isArray(meta?.languages) ? meta.languages.map(x => String(x).toLowerCase()) : [];

      const combined = `${rawLang} ${nameText} ${detailText} ${existingLang} ${metaLangs.join(" ")}`;

      if (combined.includes("vostfr")) {
        return { label: "🇫🇷 VOSTFR", cls: "lang-vostfr", priority: 1 };
      }
      if (rawLang === "fr" || metaLangs.includes("fr") || combined.includes("français") || combined.includes("french") || /\bvf\b/.test(combined)) {
        return { label: "🇫🇷 Français VF", cls: "lang-vf", priority: 0 };
      }
      if (rawLang === "en" || metaLangs.includes("en") || /\bvo\b/.test(combined) || combined.includes("anglais") || combined.includes("english")) {
        return { label: "🇬🇧 Anglais VO", cls: "lang-en", priority: 2 };
      }
      if (rawLang === "de" || metaLangs.includes("de")) {
        return { label: "🇩🇪 Allemand DE", cls: "lang-other", priority: 3 };
      }
      if (rawLang === "es" || metaLangs.includes("es")) {
        return { label: "🇪🇸 Espagnol ES", cls: "lang-other", priority: 3 };
      }
      if (rawLang === "it" || metaLangs.includes("it")) {
        return { label: "🇮🇹 Italien IT", cls: "lang-other", priority: 3 };
      }
      const code = (rawLang || metaLangs[0] || existingLang || "").trim();
      return {
        label: code ? `🌐 ${code.toUpperCase()}` : "🌐 Multi / VO",
        cls: "lang-other",
        priority: 3
      };
    }

    function findSourceMetaForElement(el, idx) {
      const name = (el.querySelector(".source-name")?.textContent || "").trim();
      const detail = (el.querySelector(".source-detail")?.textContent || "").trim();
      if (window.__kibangouSourceMap) {
        const direct = window.__kibangouSourceMap.get(`${name}|${detail}`);
        if (direct) return direct;
      }
      const list = Array.isArray(window.__kibangouSourceList) ? window.__kibangouSourceList : [];
      const exactMatch = list.find(s => (s.name || "").trim() === name && (!detail || (s.quality || "").trim() === detail || (s.url || "").includes(detail)));
      if (exactMatch) return exactMatch;
      return list[idx] || null;
    }

    function getSourceKey(el, idx) {
      const meta = findSourceMetaForElement(el, idx);
      if (meta && meta.url) return meta.url;
      const name = (el.querySelector(".source-name")?.textContent || "").trim();
      const detail = (el.querySelector(".source-detail")?.textContent || "").trim();
      return `${idx}|${name}|${detail}`;
    }

    function isLiveContext() {
      if (location.hash.startsWith("#/channels") || location.hash.includes("/live/")) return true;
      if (document.querySelector(".player-root .player-zap-btn, .player-root .iptv-bar-controls, .player-root .ch-overlay")) return true;
      return false;
    }

    function getActiveItemTitle() {
      const modalTitle = document.querySelector(".modal-sources .modal-title")?.textContent?.trim();
      const heroEl = document.querySelector(".cached-view.view-active .item-view .hero-title");
      const heroTitle = heroEl?.textContent?.trim() || heroEl?.querySelector("img[alt]")?.getAttribute("alt")?.trim();
      const playerTitle = document.querySelector(".player-root .player-top-title")?.textContent?.trim();
      return playerTitle || heroTitle || modalTitle || "KibangouTV";
    }

    async function downloadFromSourceItem(el, idx, btnEl) {
      const meta = findSourceMetaForElement(el, idx);
      const title = getActiveItemTitle();
      if (!meta || !meta.url) {
        showToast("URL de source introuvable pour le téléchargement.");
        return;
      }
      const origHtml = btnEl.innerHTML;
      btnEl.disabled = true;
      btnEl.textContent = "Préparation...";
      try {
        const resolved = await resolveSourceToPlayable(meta.url);
        if (!resolved || !resolved.url) {
          showToast("Impossible de résoudre cette source pour le téléchargement.");
          return;
        }
        await downloadResolvedVideo(resolved, title);
      } catch {
        showToast("Erreur lors de la préparation du téléchargement.");
      } finally {
        btnEl.disabled = false;
        btnEl.innerHTML = origHtml;
      }
    }

    async function downloadCurrentItemFromDetails(btnEl) {
      const origHtml = btnEl.innerHTML;
      btnEl.disabled = true;
      const wordEl = btnEl.querySelector(".kibangou-dl-word");
      if (wordEl) wordEl.textContent = "Préparation...";

      try {
        const startHash = location.hash;
        const title = getActiveItemTitle();
        const match = startHash.match(/^#\/item\/([^/]+)\/([^/]+)\/([^?]+)/);
        const itemId = match ? decodeURIComponent(match[3]) : "";
        let candidates = (itemId && window.__kibangouSourcesByItemId && window.__kibangouSourcesByItemId.get(itemId))
          ? [...window.__kibangouSourcesByItemId.get(itemId)]
          : (Array.isArray(window.__kibangouSourceList) && !match ? [...window.__kibangouSourceList] : []);

        if (!candidates.length && match) {
          const addonId = decodeURIComponent(match[1]);
          const type = decodeURIComponent(match[2]);
          const prefix = addonId === "kibangou-french-vod" ? "/french-addon" : addonId === "kibangou-adult-pro" ? "/adult-addon" : "/kibangou-addon";
          const srcUrl = type === "series"
            ? `${prefix}/source/series/${encodeURIComponent(itemId)}:1:1.json`
            : `${prefix}/source/${encodeURIComponent(type)}/${encodeURIComponent(itemId)}.json`;
          try {
            const r = await fetch(srcUrl);
            if (r.ok) {
              const j = await r.json();
              if (Array.isArray(j.sources)) candidates = j.sources;
            }
          } catch {}
          if (!candidates.length) {
            const fallbackUrl = type === "series"
              ? `https://vavoo.top/vod/source/series/${encodeURIComponent(itemId)}:1:1.json?region=FR&language=fr`
              : `https://vavoo.top/vod/source/video/${encodeURIComponent(itemId)}.json?region=FR&language=fr`;
            try {
              const r = await fetch(fallbackUrl);
              if (r.ok) {
                const j = await r.json();
                if (Array.isArray(j.sources)) candidates = j.sources;
              }
            } catch {}
          }
        }

        const prioritized = [...candidates].sort((a, b) => {
          const aLang = Array.isArray(a.languages) ? a.languages.map(x => String(x).toLowerCase()) : [];
          const bLang = Array.isArray(b.languages) ? b.languages.map(x => String(x).toLowerCase()) : [];
          const aFr = aLang.includes("fr") ? 0 : 1;
          const bFr = bLang.includes("fr") ? 0 : 1;
          if (aFr !== bFr) return aFr - bFr;
          const hostRank = (u) => {
            const l = String(u || "").toLowerCase();
            if (/dood\.to|mixdrop|mxdrop|m1xdrop|miixdrop/.test(l)) return 0;
            if (/dood\.yt/.test(l)) return 1;
            if (/filemoon/.test(l)) return 2;
            return 3;
          };
          return hostRank(a.url) - hostRank(b.url);
        });

        let hlsFallback = null;
        for (const src of prioritized) {
          if (!src || !src.url) continue;
          if (location.hash !== startHash) return;
          try {
            const resolved = await resolveSourceToPlayable(src.url);
            if (location.hash !== startHash) return;
            if (resolved && resolved.url && !isEmbedHostUrl(resolved.url)) {
              if (isHlsUrl(resolved.url)) {
                if (!hlsFallback) hlsFallback = resolved;
                continue;
              }
              await downloadResolvedVideo(resolved, title);
              return;
            }
          } catch {}
        }

        if (hlsFallback) {
          await downloadResolvedVideo(hlsFallback, title);
          return;
        }

        if (location.hash === startHash) {
          showToast("Aucune source téléchargeable disponible pour ce titre.");
        }
      } finally {
        btnEl.disabled = false;
        btnEl.innerHTML = origHtml;
      }
    }

    const vodAutoState = {
      wantAutoPlay: false,
      activeChain: false,
      triedKeys: new Set(),
      attemptStartedAt: 0,
      lastFallbackClickAt: 0
    };

    document.addEventListener("click", (e) => {
      const target = e.target instanceof Element ? e.target : null;
      if (!target) return;

      if (target.closest(".item-view .btn-hero-play:not(.is-empty):not(.is-busy), .item-view .ep-tile, .item-view .ep-card")) {
        if (!isLiveContext()) {
          vodAutoState.wantAutoPlay = true;
          vodAutoState.activeChain = true;
          vodAutoState.triedKeys.clear();
          vodAutoState.attemptStartedAt = Date.now();
        }
        return;
      }

      const srcItem = target.closest(".modal-sources .source-item:not(.source-item-failed):not(.source-kept):not(.source-keep-season)");
      if (srcItem && !target.closest(".kibangou-src-dl-btn") && !isLiveContext()) {
        const allItems = Array.from(document.querySelectorAll(".modal-sources .source-item:not(.source-item-failed):not(.source-kept):not(.source-keep-season)"));
        const idx = allItems.indexOf(srcItem);
        if (idx >= 0) {
          vodAutoState.triedKeys.add(getSourceKey(srcItem, idx));
        }
        vodAutoState.activeChain = true;
        vodAutoState.wantAutoPlay = false;
        vodAutoState.attemptStartedAt = Date.now();
        return;
      }

      if (target.closest(".modal-sources .modal-close")) {
        if (e.isTrusted) {
          vodAutoState.wantAutoPlay = false;
          vodAutoState.activeChain = false;
        }
        return;
      }

      if (target.closest('.player-bar-right .player-ctrl-btn[data-key="S"]')) {
        if (e.isTrusted) {
          vodAutoState.wantAutoPlay = false;
        }
      }
    }, true);

    function triggerPlayerSourceFallback() {
      const now = Date.now();
      if (now - vodAutoState.lastFallbackClickAt < 1800) return;
      if (document.querySelector(".modal-sources")) return;

      const srcBtn = document.querySelector('.player-bar-right .player-ctrl-btn[data-key="S"]');
      if (!srcBtn) return;

      vodAutoState.lastFallbackClickAt = now;
      vodAutoState.wantAutoPlay = true;
      srcBtn.click();
    }

    function enhanceSourcesModal() {
      const modal = document.querySelector(".modal.modal-sources");
      if (!modal) return;
      const live = isLiveContext();
      const body = modal.querySelector(".modal-body");
      if (!body || body.querySelector(".source-skel")) return;

      const items = Array.from(body.querySelectorAll(".source-item:not(.source-item-failed):not(.source-kept):not(.source-keep-season)"));
      const hasFailureNotice = Boolean(modal.querySelector(".source-failure"));

      items.forEach((item, idx) => {
        const meta = findSourceMetaForElement(item, idx);
        const langInfo = parseSourceLanguage(item, meta);

        let langsWrap = item.querySelector(".source-langs");
        if (!langsWrap) {
          langsWrap = document.createElement("div");
          langsWrap.className = "source-langs";
          item.appendChild(langsWrap);
        }

        if (!langsWrap.querySelector(".kibangou-lang-badge")) {
          langsWrap.textContent = "";
          const badge = document.createElement("span");
          badge.className = `kibangou-lang-badge ${langInfo.cls}`;
          badge.textContent = langInfo.label;
          langsWrap.appendChild(badge);
        }

        if (!live && !item.classList.contains("source-item-error") && !item.querySelector(".kibangou-src-dl-btn")) {
          const dlBtn = document.createElement("button");
          dlBtn.type = "button";
          dlBtn.className = "kibangou-src-dl-btn";
          dlBtn.title = "Télécharger cette source";
          dlBtn.setAttribute("aria-label", "Télécharger cette source");
          dlBtn.innerHTML = `${SVG_DOWNLOAD}<span>Télécharger</span>`;
          dlBtn.addEventListener("click", (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
            downloadFromSourceItem(item, idx, dlBtn);
          });
          item.appendChild(dlBtn);
        }
      });

      if (live) return;

      if (vodAutoState.wantAutoPlay || (vodAutoState.activeChain && hasFailureNotice)) {
        items.forEach((item, idx) => {
          if (item.classList.contains("source-item-error") || (hasFailureNotice && item.classList.contains("active"))) {
            vodAutoState.triedKeys.add(getSourceKey(item, idx));
          }
        });

        const candidates = items
          .map((item, idx) => {
            const meta = findSourceMetaForElement(item, idx);
            const langInfo = parseSourceLanguage(item, meta);
            const key = getSourceKey(item, idx);
            return { item, idx, key, priority: langInfo.priority, label: langInfo.label };
          })
          .filter(c =>
            !c.item.classList.contains("source-item-error") &&
            !c.item.classList.contains("source-item-busy") &&
            !vodAutoState.triedKeys.has(c.key)
          )
          .sort((a, b) => a.priority - b.priority || a.idx - b.idx);

        if (candidates.length > 0) {
          const next = candidates[0];
          vodAutoState.triedKeys.add(next.key);
          vodAutoState.wantAutoPlay = false;
          vodAutoState.attemptStartedAt = Date.now();
          showToast(
            hasFailureNotice
              ? `Source indisponible — bascule auto (${next.label})...`
              : `Lecture automatique (${next.label})...`
          );
          requestAnimationFrame(() => next.item.click());
        } else if (hasFailureNotice) {
          vodAutoState.activeChain = false;
          vodAutoState.wantAutoPlay = false;
          showToast("Aucune autre source fonctionnelle disponible.");
        }
      }
    }

    function enhanceVodItemDetails() {
      if (isLiveContext()) return;

    function enhanceVodPlayer() {
      const playerRoot = document.querySelector(".player-root");
      if (!playerRoot) return;
      const live = isLiveContext();

      if (!live) {
        const barRight = playerRoot.querySelector(".player-bar-right");
        if (barRight && !barRight.querySelector("#kibangou-player-download-btn")) {
          const dlBtn = document.createElement("button");
          dlBtn.type = "button";
          dlBtn.id = "kibangou-player-download-btn";
          dlBtn.className = "player-ctrl-btn kibangou-player-dl-btn";
          dlBtn.title = "Télécharger cette vidéo";
          dlBtn.setAttribute("aria-label", "Télécharger");
          dlBtn.innerHTML = `${SVG_DOWNLOAD}<span>Télécharger</span>`;
          dlBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const streamInfo = window.__kibangouCurrentStream;
            if (streamInfo && streamInfo.url && !isEmbedHostUrl(streamInfo.url)) {
              dlBtn.disabled = true;
              try {
                await downloadResolvedVideo(streamInfo, getActiveItemTitle());
              } finally {
                dlBtn.disabled = false;
              }
              return;
            }
            if (Array.isArray(window.__kibangouSourceList) && window.__kibangouSourceList.length > 0) {
              dlBtn.disabled = true;
              try {
                let hlsFallback = null;
                for (const src of window.__kibangouSourceList.slice(0, 5)) {
                  if (!src || !src.url) continue;
                  const resolved = await resolveSourceToPlayable(src.url).catch(() => null);
                  if (resolved && resolved.url && !isEmbedHostUrl(resolved.url)) {
                    if (isHlsUrl(resolved.url)) {
                      if (!hlsFallback) hlsFallback = resolved;
                      continue;
                    }
                    await downloadResolvedVideo(resolved, getActiveItemTitle());
                    return;
                  }
                }
                if (hlsFallback) {
                  await downloadResolvedVideo(hlsFallback, getActiveItemTitle());
                  return;
                }
              } finally {
                dlBtn.disabled = false;
              }
            }
            showToast("Aucun flux vidéo téléchargeable disponible pour ce lecteur.");
          });
          barRight.prepend(dlBtn);
        }
      }

      const barRightForCast = playerRoot.querySelector(".player-bar-right");
      if (barRightForCast && !barRightForCast.querySelector("#kibangou-player-cast-btn")) {
        const castBtn = document.createElement("button");
        castBtn.type = "button";
        castBtn.id = "kibangou-player-cast-btn";
        castBtn.className = "player-ctrl-btn";
        castBtn.title = "Diffuser sur TV (Chromecast / AirPlay)";
        castBtn.setAttribute("aria-label", "Diffuser sur TV");
        castBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><line x1="2" y1="20" x2="2.01" y2="20"/></svg>`;
        castBtn.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          const v = playerRoot.querySelector("video.player-video");
          if (v && typeof v.webkitShowPlaybackTargetPicker === "function") {
            v.webkitShowPlaybackTargetPicker();
            return;
          }
          if (v && v.remote && typeof v.remote.prompt === "function") {
            try {
              await v.remote.prompt();
              return;
            } catch {}
          }
          showToast("Aucun écran Chromecast/AirPlay détecté sur ce réseau Wi-Fi.");
        });
        barRightForCast.prepend(castBtn);
      }

      const video = playerRoot.querySelector("video.player-video");
      if (video && !video.dataset.kibangouPlayFixBound) {
        video.dataset.kibangouPlayFixBound = "1";
        try { video.preload = "auto"; } catch {}
        video.addEventListener("play", () => {
          const hls = window.__kibangouHls;
          if (hls) {
            hls._lastResumeAt = Date.now();
            if (live && typeof hls.liveSyncPosition === "number" && isFinite(hls.liveSyncPosition)) {
              if (hls.liveSyncPosition - video.currentTime > 6) {
                try {
                  video.currentTime = Math.max(0, hls.liveSyncPosition - 1);
                  hls.startLoad(-1);
                } catch {}
              }
            }
          }
        });

        playerRoot.addEventListener("click", (ev) => {
          const t = ev.target instanceof Element ? ev.target : null;
          if (!t || t.closest("button, a, input, select, .player-bar, .player-top, .modal-sources")) return;
          if (video.paused) {
            setTimeout(() => {
              if (video.paused && !video.ended) {
                video.play().catch(() => {});
              }
            }, 90);
          }
        });
      }

      if (!live) {
        if (video && !video.dataset.vodWatchdogBound) {
          video.dataset.vodWatchdogBound = "1";
          video.addEventListener("playing", () => {
            vodAutoState.attemptStartedAt = Date.now();
          });
          video.addEventListener("error", () => {
            if (vodAutoState.activeChain && !isLiveContext()) {
              triggerPlayerSourceFallback();
            }
          });
        }

        const errBox = playerRoot.querySelector(".player-error");
        if (errBox && vodAutoState.activeChain) {
          triggerPlayerSourceFallback();
        } else if (
          video &&
          vodAutoState.activeChain &&
          vodAutoState.attemptStartedAt > 0 &&
          !document.querySelector(".modal-sources") &&
          !video.paused &&
          !video.ended &&
          video.currentTime === 0 &&
          video.readyState < 3 &&
          Date.now() - vodAutoState.attemptStartedAt > 12000
        ) {
          triggerPlayerSourceFallback();
        }
      }
    }

      }

      const allTabs = Array.from(document.querySelectorAll(".channels-view .ep-pill")).filter(el => {
        const text = (el.textContent || "").trim();

      const liveTab = allTabs.find(el => el.textContent.trim() === "Live TV");

        favTab.after(liveTab);
      }

          if (headTitle && headTitle.textContent.trim() !== "Profil") {
            headTitle.textContent = "Profil";

            if (text.includes("Supprimer les données de ce site") || text.includes("Delete this site")) {

              </div>

            targetContainer.appendChild(adultCard);

          if (!targetContainer.querySelector("#settings-apps-offline-card")) {
            const appsCard = document.createElement("div");
            appsCard.id = "settings-apps-offline-card";
            appsCard.className = "s-group kibangou-settings-card";
            appsCard.setAttribute("data-zone", "v");
            appsCard.innerHTML = `
              <div style="font-weight:700; color:#FFFFFF; font-size:1.02rem;">Hors-ligne, Applications &amp; Performances</div>
              <div style="font-size:0.84rem; color:#8E99A4;">Retrouvez vos vidéos enregistrées sans connexion, téléchargez les apps Mobile/PC/TV ou consultez les Web Vitals.</div>
              <div class="kibangou-adult-links">
                <button type="button" id="btn-open-offline-videos" class="kibangou-adult-link kibangou-adult-link-primary" style="border:none;cursor:pointer;">Vidéos hors-ligne (PWA)</button>
                <a href="/download" class="kibangou-adult-link kibangou-adult-link-secondary">Apps Mobile, PC (.exe) &amp; TV →</a>
              </div>
            `;
            appsCard.querySelector("#btn-open-offline-videos").addEventListener("click", openOfflineModal);
            targetContainer.appendChild(appsCard);
          }

          if (!targetContainer.querySelector("#settings-logout-card")) {
            let userLabel = "Vous êtes connecté à KibangouTV.";
            try {
              const u = JSON.parse(localStorage.getItem("kibangoutv_user") || "null");
              if (u && u.email) {
                userLabel = `Connecté en tant que ${u.name || u.email} (${u.email}${u.provider === "google" ? " · Google" : ""}).`;
              }
            } catch {}
            const card = document.createElement("div");
            card.id = "settings-logout-card";
            card.className = "s-group kibangou-settings-card";
            card.setAttribute("data-zone", "v");
            card.style.background = "rgba(248, 113, 113, 0.08)";
            card.style.borderColor = "rgba(248, 113, 113, 0.25)";
            card.innerHTML = `
              <div style="font-weight:700; color:#FFFFFF; font-size:1.02rem;">Compte & Session KibangouTV</div>
              <div style="font-size:0.84rem; color:#8E99A4;">${escapeHtml(userLabel)}</div>
              <button type="button" id="btn-settings-logout-action" style="margin-top:4px; height:42px; width:fit-content; padding:0 20px; border-radius:10px; border:none; background:#E5484D; color:#FFFFFF; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

            card.querySelector("#btn-settings-logout-action").addEventListener("click", performLogout);

      enhanceVodItemDetails();
      enhanceSourcesModal();
      enhanceVodPlayer();

    function updateActiveNav() {
      const hash = location.hash || "#/";
      const isHome = hash === "#/" || hash === "" || hash.startsWith("#/?");
      document.body.classList.toggle("is-home", isHome);

      const mBack = document.getElementById("m-btn-back");
      if (mBack) mBack.setAttribute("aria-hidden", isHome ? "true" : "false");

      const isSearch = hash.startsWith("#/search");
      const isSettings = hash.startsWith("#/settings");
      const mSearch = document.getElementById("m-btn-search");
      const mSettings = document.getElementById("m-btn-settings");
      if (mSearch) mSearch.classList.toggle("active", isSearch);
      if (mSettings) mSettings.classList.toggle("active", isSettings);

      const navFilms = document.getElementById("nav-films");
      const navSeries = document.getElementById("nav-series");
      const bnavFilms = document.getElementById("bnav-films");
      const bnavSeries = document.getElementById("bnav-series");

      const isFilm = hash.includes("video/movie");
      const isSeries = hash.includes("series/series");

      if (navFilms) navFilms.classList.toggle("active", isFilm);
      if (bnavFilms) bnavFilms.classList.toggle("active", isFilm);

      if (navSeries) navSeries.classList.toggle("active", isSeries);
      if (bnavSeries) bnavSeries.classList.toggle("active", isSeries);

      if (isFilm || isSeries) {
        document.querySelectorAll('.sidebar-nav .nav-item:not(#nav-films):not(#nav-series)').forEach(el => el.classList.remove("active"));
        document.querySelectorAll('.bnav .bnav-item:not(#bnav-films):not(#bnav-series)').forEach(el => el.classList.remove("active"));
      }

      const bnav = document.querySelector(".bnav");
      if (bnav) {
        const visibleItems = Array.from(bnav.querySelectorAll(".bnav-item")).filter(el => {
          return window.getComputedStyle(el).display !== "none";
        });
        if (visibleItems.length > 0) {
          bnav.style.setProperty("--bnav-count", visibleItems.length);
          const activeIdx = visibleItems.findIndex(el => el.classList.contains("active"));
          if (activeIdx >= 0) {
            bnav.style.setProperty("--bnav-active", activeIdx);
          }
        }
      }
    }

    const navObserver = new MutationObserver(() => {
      injectCustomNavItems();
    });
    navObserver.observe(document.body, { childList: true, subtree: true });

    function checkChannelsHash() {
      if (location.hash === "#/channels") {
        location.replace("#/channels?src=vavoo-live%2Fchannels");
      }
    }
    checkChannelsHash();

    window.addEventListener("player-closed", () => {
      vodAutoState.wantAutoPlay = false;
      vodAutoState.activeChain = false;
      vodAutoState.attemptStartedAt = 0;
      window.__kibangouCurrentStream = null;
    });

    window.addEventListener("hashchange", () => {
      vodAutoState.wantAutoPlay = false;
      vodAutoState.activeChain = false;
      vodAutoState.attemptStartedAt = 0;
      window.__kibangouCurrentStream = null;
      window.__kibangouSourceList = [];
      checkChannelsHash();
      injectCustomNavItems();
      updateActiveNav();
    });

    setInterval(() => {
      injectCustomNavItems();
    }, 350);

    setInterval(() => {
      const hero = document.querySelector(".hero");
      if (!hero || hero.matches(":hover")) return;

      let targets = Array.from(document.querySelectorAll(".hero-strip .hero-thumb"));
      if (!targets.length) {
        targets = Array.from(document.querySelectorAll(".hero-dots .hero-dot"));
      }
      if (targets.length <= 1) return;

      const activeIdx = targets.findIndex(el => el.classList.contains("active") || el.getAttribute("aria-current") === "true");
      if (activeIdx !== -1) {
        const nextIdx = (activeIdx + 1) % targets.length;
        targets[nextIdx].click();
      }
    }, 6000);
    (function initFreeWebVitals() {
      const queue = [];
      let timer = null;
      const device = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? "mobile" : "desktop";
      const conn = navigator.connection?.effectiveType || "unknown";
      function flush() {
        timer = null;
        if (!queue.length) return;
        const payload = JSON.stringify({ events: queue.splice(0, queue.length) });
        if (navigator.sendBeacon) {
          navigator.sendBeacon("/api/telemetry", new Blob([payload], { type: "application/json" }));
        } else {
          fetch("/api/telemetry", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true }).catch(() => {});
        }
      }
      function pushMetric(metric, value, label = "") {
        queue.push({
          metric,
          value: Math.round((Number(value) || 0) * 100) / 100,
          label: String(label || "").slice(0, 120),
          path: location.hash || location.pathname || "/",
          connection: conn,
          device
        });
        if (!timer) timer = setTimeout(flush, 2500);
      }
      pushMetric("PAGE_VIEW", 1, document.title || "KibangouTV");
      window.addEventListener("hashchange", () => {
        pushMetric("PAGE_VIEW", 1, location.hash || "#/");
      });
      document.addEventListener("click", (ev) => {
        const el = ev.target instanceof Element ? ev.target.closest("a, button, .ep-pill, .source-item, .card, .nav-item, .bnav-item") : null;
        if (!el) return;
        const lbl = (el.getAttribute("aria-label") || el.getAttribute("title") || el.textContent || el.tagName).replace(/\s+/g, " ").trim().slice(0, 80);
        pushMetric("CLICK", 1, lbl);
        if (el.matches(".kibangou-download-btn, .kibangou-player-dl-btn, .kibangou-src-dl-btn")) {
          pushMetric("DOWNLOAD_CLICK", 1, lbl);
        }
      }, true);
      window.addEventListener("kibangou-hls-attached", () => pushMetric("PLAY_START", 1, location.hash || "live"));
      try {
        const nav = performance.getEntriesByType("navigation")[0];
        if (nav && nav.responseStart > 0) pushMetric("TTFB", nav.responseStart);
      } catch {}
      if (typeof PerformanceObserver === "function") {
        try {
          new PerformanceObserver((list) => {
            const entries = list.getEntries();
            const last = entries[entries.length - 1];
            if (last) pushMetric("LCP", last.startTime);
          }).observe({ type: "largest-contentful-paint", buffered: true });
        } catch {}
        try {
          new PerformanceObserver((list) => {
            for (const e of list.getEntries()) {
              if (e.name === "first-contentful-paint") pushMetric("FCP", e.startTime);
            }
          }).observe({ type: "paint", buffered: true });
        } catch {}
        try {
          let clsTotal = 0;
          new PerformanceObserver((list) => {
            for (const e of list.getEntries()) {
              if (!e.hadRecentInput) clsTotal += e.value;
            }
            pushMetric("CLS", clsTotal);
          }).observe({ type: "layout-shift", buffered: true });
        } catch {}
      }
      window.addEventListener("kibangou-auto-downgrade", () => pushMetric("BUFFER_STALL", 1));
    })();

    (async function initKibangouAds() {
      try {

        if (!res.ok) return;
        const { ads = [] } = await res.json();
